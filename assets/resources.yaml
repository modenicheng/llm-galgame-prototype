# 校园技术社团分支资源目录（campus branch asset catalog）
#
# 素材策略（docs/superpowers/specs/2026-09-06-campus-ops-event-design.md §7）：
# - 背景复用现有校园（clubroom/hallway）素材；地下据点不入目录。
# - 树莓娘立绘为项目自制纯色占位图，不含任何官方角色绘制；
#   BITNP 素材未获授权前不接入、不复制、不再分发。
# - 语音未配置：audio provider 为 disabled，缺失音色时降级为纯文本，
#   不阻塞启动。

guidance: |
  当前素材覆盖校园社团部室与走廊场景，围绕技术社团值班日常展开。

  背景应尽量复用已有资源，不要因为轻微视角变化频繁切换。

  树莓娘目前只有一张占位立绘（placeholder）：
  所有表情变体共用同一张图，不要期待表情有视觉区别；
  可以用 `ch raspberry:default` 改变站位，但立绘画面不会变化。

  角色只能使用其"可用立绘组"内的素材组；
  默认每个角色只有自己的立绘组。

  舞台站位互斥：一个位置只能站一个可见角色，新角色占位会让原占位者自动隐藏；
  多角色同场时用 [|位置] 或 ch <id> <位置> 分开。
  角色离场用 ch <id> exit，不要只依赖 hide。

backgrounds:
  hallway_day:
    src: backgrounds/hallway_day.jpg
    description: |
      校园室内长走廊，左侧有窗户和水槽，右侧有教室、公告栏与楼梯。
      明亮白天光线。
      适合白天值班、招新与日常交流场景。

  hallway_evening:
    src: backgrounds/hallway_evening.jpg
    description: |
      同一校园走廊，整体为明显的暖黄色/橙色傍晚光线。
      适合放学后气氛缓和的交流场景。

  hallway_night_on:
    src: backgrounds/hallway_night_on.jpg
    description: |
      同一走廊，窗外已是夜色，走廊内部仍有照明。
      适合夜间活动仍在继续的场景。

  hallway_night_off:
    src: backgrounds/hallway_night_off.jpg
    description: |
      同一走廊，窗外夜色，室内灯光明显关闭或大幅减弱，整体很暗。
      适合闭馆前后、需要安静的场面。

  clubroom_day:
    src: backgrounds/clubroom_day.jpg
    description: |
      校园社团活动室/教室，有黑板、书架、长桌、电脑、打印设备和大量椅子。
      白天窗光明亮。
      适合技术分享、值班接待与设备排查的主场景。

  clubroom_evening:
    src: backgrounds/clubroom_evening.jpg
    description: |
      同一社团活动室，窗光和室内色调变为暖黄色傍晚光。
      适合傍晚时分的收尾与交接交流。

  clubroom_night_on:
    src: backgrounds/clubroom_night_on.jpg
    description: |
      同一社团活动室，窗外是夜色，室内灯光保持开启，桌椅和书架仍清晰可见。
      适合夜间仍在继续的活动或排查。

  clubroom_night_off:
    src: backgrounds/clubroom_night_off.jpg
    description: |
      同一社团活动室，窗外是夜色，室内照明关闭或显著减弱，整体呈暗蓝色。
      适合锁门前最后的确认或安静场景。

bgm:
  relax:
    src: audio/bgm/relax.mp3
    description: |
      大调；氛围温暖静谧，适合室内；慢节奏，悠然
      原声吉他做引子；第二把吉他随后进入演奏主题

  calm:
    src: audio/bgm/calm.mp3
    description: |
      小调，带有淡淡的忧伤，却十分平淡；静谧但并不恐怖；音乐徘徊不前
      钢琴曲
  mountain:
    src: audio/bgm/mountain.mp3
    description: |
      欢快的、节奏快的流行纯音乐；有律动感的鼓组；
      原生吉他作为铺垫，主旋律主要由合成器演奏，音色富有弹性

sound_effects:
  terminal_beep:
    src: audio/se/terminal_beep.ogg
    description: |
      电子设备发出的短促提示音（合成占位），可用于设备反应或提示。

sprite_sets:
  raspberry:
    description: |
      树莓娘占位立绘（项目自制纯色占位，非官方素材）。
      只有一个变体，所有表情共用。

    variants:
      default:
        src: characters/raspberry/placeholder.png
        description: 唯一占位立绘，无表情区分。

characters:
  raspberry:
    script_name: 树莓娘
    display_name: 树莓娘
    sprite_set: raspberry
    default_variant: default
    default_position: center
