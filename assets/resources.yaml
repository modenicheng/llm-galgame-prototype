# 校园技术社团分支资源目录（campus branch asset catalog）
#
# 素材策略（docs/superpowers/specs/2026-09-06-campus-ops-event-design.md §7）：
# - 背景使用校园（clubroom/wencui_corridor）素材；地下据点不入目录。
# - 树莓娘立绘基于项目负责人提供的官方分层原稿，经自制蓝幕差分管线加工产出
#   （2026-09-15），资产不入库、不上传，仅限内部流通；
#   BITNP 其余素材未获授权前不接入、不复制、不再分发。
# - 语音未配置：audio provider 为 disabled，缺失音色时降级为纯文本，
#   不阻塞启动。

# 这个字段只存通用的资产调用规则，不要在里面写素材状态
guidance: |
  当前素材覆盖校园社团部室与走廊场景，围绕技术社团值班日常展开。

  背景应尽量复用已有资源，不要因为轻微视角变化频繁切换。

  按台词情绪用 `ch raspberry:<变体>` 切换表情，
  悬念/身份未揭示场面可用剪影。

  通用配角男生A/男生B/女生A/女生B（male_A/male_B/female_A/female_B）
  可用于来访者、同学、路人等群像场面，
  用 `ch <角色>:<变体>` 在 base/smile/surprised/embarrassed/joyful/angry/
  thinking/smug 间切换表情（平静/微笑/惊讶/害羞/开怀/生气/思考/得意）；
  他们默认站在左右侧，不要抢占树莓娘的中央位。

  角色只能使用其"可用立绘组"内的素材组；
  默认每个角色只有自己的立绘组。

  舞台站位互斥：一个位置只能站一个可见角色，新角色占位会让原占位者自动隐藏；
  多角色同场时用 [|位置] 或 ch <id> <位置> 分开。
  角色离场用 ch <id> exit，不要只依赖 hide。

backgrounds:
  clubroom_day:
    src: backgrounds/clubroom_day.jpg
    description: |
      校园社团活动室/教室，有黑板、书架、长桌、电脑、打印设备和大量椅子。
      白天窗光明亮。
      适合技术分享、值班接待与设备排查的主场景。
  clubroom_evening:
    src: backgrounds/clubroom_evening.jpg
    description: |
      同一社团活动室，窗光和室内色调变为暖黄色傍晚光。
      适合傍晚时分的收尾与交接交流。

  clubroom_night_on:
    src: backgrounds/clubroom_night_on.jpg
    description: |
      同一社团活动室，窗外是夜色，室内灯光保持开启，桌椅和书架仍清晰可见。
      适合夜间仍在继续的活动或排查。

  clubroom_night_off:
    src: backgrounds/clubroom_night_off.jpg
    description: |
      同一社团活动室，窗外是夜色，室内照明关闭或显著减弱，整体呈暗蓝色。
      适合锁门前最后的确认或安静场景。

  wencui_corridor_day:
    src: backgrounds/wencui_corridor_day.jpg
    description: |
      文萃楼高层走廊，左侧是整面落地窗（能看到对面教学楼与楼下过道），
      窗下有白色暖气片，地面光洁，右侧依次是房间门。白天阳光充足。
      适合白天的值班、带路讲解、走廊偶遇场景。

  wencui_corridor_evening:
    src: backgrounds/wencui_corridor_evening.jpg
    description: |
      同一文萃楼走廊，窗外变为橙粉色晚霞，夕阳斜照进走廊。
      适合傍晚收尾、活动散场后的交流场景。

  wencui_corridor_night_on:
    src: backgrounds/wencui_corridor_night_on.jpg
    description: |
      同一文萃楼走廊，窗外是夜色与对面楼里零星的灯光，
      走廊顶灯保持开启，明亮温暖。
      适合夜间值班、深夜仍在排查的场景。

  wencui_corridor_night_off:
    src: backgrounds/wencui_corridor_night_off.jpg
    description: |
      同一文萃楼走廊，室内灯已全部关闭，只有窗外月光和远处路灯的微光，
      整体很暗。
      适合锁门前最后检查、夜深人静的场面。

  campus_road_day:
    src: backgrounds/campus_road_day.jpg
    description: |
      校园林荫道外景，左侧是教学楼与齐腰绿篱，右侧是茂密树丛，
      梧桐树夹道，路面洒满斑驳树影。白天明亮。
      适合路上同行、赶路、骑车路过的过场。

  campus_road_evening:
    src: backgrounds/campus_road_evening.jpg
    description: |
      同一校园林荫道，夕阳金光透过树叶洒在路面。
      适合傍晚同路、活动散场后的交流。

  campus_road_night:
    src: backgrounds/campus_road_night.jpg
    description: |
      同一校园林荫道，夜色深蓝，路灯亮起，教学楼有零星亮灯的窗。
      适合夜间同行、晚归的场景。

  club_plaza_day:
    src: backgrounds/club_plaza_day.jpg
    description: |
      学生社团文化广场：橙色外墙的社团用房、白色天桥与伞状顶棚，
      前面是开阔的石板广场。白天晴朗。
      适合招新、社团活动、广场碰头的场景。

  club_plaza_evening:
    src: backgrounds/club_plaza_evening.jpg
    description: |
      同一学生社团文化广场，晚霞橙红，广场被夕阳染成暖色。
      适合傍晚活动收尾、广场闲谈。

  club_plaza_night:
    src: backgrounds/club_plaza_night.jpg
    description: |
      同一学生社团文化广场，夜色深蓝，建筑玻璃门透出暖光，
      广场路灯亮起。
      适合夜间活动、广场夜谈的场景。

bgm:
  relax:
    src: audio/bgm/relax.mp3
    description: |
      大调；氛围温暖静谧，适合室内；慢节奏，悠然
      原声吉他做引子；第二把吉他随后进入演奏主题

  calm:
    src: audio/bgm/calm.mp3
    description: |
      小调，带有淡淡的忧伤，却十分平淡；静谧但并不恐怖；音乐徘徊不前
      钢琴曲
  mountain:
    src: audio/bgm/mountain.mp3
    description: |
      欢快的、节奏快的流行纯音乐；有律动感的鼓组；
      原生吉他作为铺垫，主旋律主要由合成器演奏，音色富有弹性

