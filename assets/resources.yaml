# BGM 播放默认（秒；可选项，缺省 = 整曲循环、无淡入淡出）。
# 每曲在 bgm.<id>.playback 里覆盖同名字段，字段：
#   start / end   裁切循环窗口（到达 end 回卷 start；end 缺省播到文件尾）
#   fade_in       起曲淡入时长
#   fade_out      切歌/停止前的淡出时长
bgm_playback:
  fade_in: 1.2
  fade_out: 1.8

bgm:
  relax:
    src: audio/bgm/relax.mp3
    # playback:          # 每曲覆写示例（覆盖上面的全局默认）
    #   start: 0.5       # 跳过文件头的静音/噪声段
    #   end: 92.0        # 到 92s 回卷，避开后半段
    #   fade_in: 2.0
    #   fade_out: 2.5
    description: |
      大调；氛围温暖静谧，适合室内；慢节奏，悠然
      原声吉他做引子；第二把吉他随后进入演奏主题

  calm:
    src: audio/bgm/calm.mp3
    description: |
      小调，带有淡淡的忧伤，却十分平淡；静谧但并不恐怖；音乐徘徊不前
      钢琴曲
  mountain:
    src: audio/bgm/mountain.mp3
    description: |
      欢快的、节奏快的流行纯音乐；有律动感的鼓组；
      原声吉他作为铺垫，主旋律主要由合成器演奏，音色富有弹性

sound_effects:
  terminal_beep:
    src: audio/se/terminal_beep.ogg
    description: |
      电子设备发出的短促提示音（合成占位），可用于设备反应或提示。

sprite_sets:
  # 树莓娘资产目录不入库（内部流通约定，见 assets/ATTRIBUTION.md）；
  # 新环境需先把立绘文件直接复制到 characters/raspberry/ 才能加载。
  raspberry:
    description: |
      树莓娘差分立绘（基于负责人提供的官方分层原稿加工，仅限内部流通）。
      base 为基准形态，其余为表情/情绪差分与剪影，全身图、透明背景。
    presentation:
      # 全身立绘统一去透明边：差分逐像素对齐、同套规格一致，
      # 前端按归一画布贴底缩放（派生文件见 docs/asset-management.md）。
      # ground 把各差分的内容底边对齐到同一地面线：union 画布底边若被
      # 画得偏低的差分占据，其余差分会在舞台上整体悬空。
      normalize: true
      ground: true
      # 归一画布顶部被抬手系差分（cheer/proud）撑高，base 本体只占画布
      # 高 94.5%，默认 0.92 占比会显得比配角矮一截，补到 0.95。
      height: 0.95

    variants:
      base:
        src: characters/raspberry/base.png
        description: 基准立绘，表情平和开朗（默认变体）。
      mysterious_silhouette:
        src: characters/raspberry/mysterious_silhouette.png
