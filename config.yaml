app:
  default_host: web

local_web:
  host: 127.0.0.1
  port: 0
  open_browser: true
  controller_limit: 1

api:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  timeout_ms: 60000
  token_limit_field: max_completion_tokens

# 背景 LLM 代理独立模型参数（2026-09-19）：未给出的字段逐项回退上方 api.*。
# 记忆代理此前与主写手同模型且关闭思考、输出预算仅 400 token，
# 「无法解析为有效提案，本批跳过」频发；现单独开 max 推理强度并给足预算。
# 注意：reasoning token 计入该代理的 max_tokens 预算，开思考必须给足。
agents:
  memory:
    # 换模型 / 换供应商时取消注释覆盖：
    # model: deepseek-reasoner
    # base_url: https://api.deepseek.com
    # api_key_env: OPENAI_API_KEY
    thinking:
      type: enabled
      effort: max
    max_tokens: 4000
  recap:
    # 前情梗概压缩器：保持关闭思考；细节化后预算放宽（默认 900）。
    # max_tokens: 900

generation:
  temperature: 0.7
  # 1400 常在长段结尾截断（2048 给模型足够预算
  max_tokens: 2048
  # 写手思考链（DeepSeek 顶层 thinking + reasoning_effort）。
  # 开启时：temperature 被服务端忽略；reasoning token 计入 max_completion_tokens。
  # 2026-09-18 实测：不开思考时错误率 35%（开 low 档显著更低）——
  # 刻意保持关闭作为找 bug 的对照配置，修完再评估是否长期开启。
  thinking:
    type: disabled
  repair_attempts: 4
  # 同一段连续修复链上限：链耗尽后续写转入末段收束提示（L2），
  # 仍连续失败再启用强制收束保险丝（L3）。0 = 不设上限（旧行为）。
  max_consecutive_repairs: 2

# 文本缓冲阈值（docs §74）：播放达到两句即可开始；正常保持六句未来内容；只剩4句时启动续写
text_buffer:
  start_threshold_lines: 2
  target_lines: 8
  refill_threshold_lines: 4

# 资源目录（docs §57）：角色绑定、背景/BGM/立绘等资源描述
assets:
  catalog: assets/resources.yaml

prefetch:
  branch_dialogue_lines: 3
  branch_concurrency: 3
  input_bridge:
    enabled: true
    min_events: 1
    max_events: 2
    only_narration: true

input:
  kind: dialogue
  require_preview_confirmation: true
  show_generation_status: false

interaction:
  allowed_modes:
    - choice
    - hybrid
    - input

  default_mode: hybrid

  options:
    min_count: 2
    max_count: 5

  input:
    max_length: 500
    max_consecutive_pure_input: 1

media:
  audio:
    # V1 遗留平面字段：保持默认，CLI 行为不变（enabled=false 不等待音频）。
    enabled: false
    provider: disabled

    planner:
      candidate_prefetch_lines: 1
      max_active_future_lines: 4

    playback:
      # 每句角色音频开播前的固定延迟，用于同步视觉与听觉（0 = 不延迟）。
      # 若发现配音比字幕快/慢，可在此微调。
      voice_delay_ms: 500
      # 开播前固定延迟：给语音合成开头留自然停顿，避免听感突兀（语音为预合成）
      startup_buffer_ms: 350
      critical_watermark_ms: 500
      low_watermark_ms: 2500
      target_buffer_ms: 6500

    synthesis:
      # V2 权威开关：web 模式从这里读取 provider（dashscope / local / mock / disabled）。
      # local = 本机 tts-server（tts-server/，Qwen3-TTS-12Hz-1.7B-Base，
      # 树莓娘 paimeng 克隆 + 四配角内置音色克隆，详见 tts-server/README）。
      provider: local
      # 4 与 tts-server 的浪批量一致：单请求并发占满一个 batch 才不吃亏
      max_concurrency: 4
      model_profile: local_qwen3_base
      api_key_env: DASHSCOPE_API_KEY
      format: pcm_s16le
      # 实际合成模型在 voices.yaml 逐音色配置（model 字段），支持两个族：
      #   cosyvoice*（本 sample_rate 生效）与 qwen3-tts*（固定 24000 输出）。
      # voices.yaml 出现 qwen3-tts 档案时此处必须为 24000（启动校验拦截）；
      # local-qwen3-tts 同样固定 24000；cosyvoice 同样支持 24000，混布统一 24k。
      sample_rate: 24000

    cache:
      max_bytes: 536870912
      cleanup_target_bytes: 402653184
      write_batch_bytes: 262144
      write_flush_interval_ms: 300
      partial_ttl_minutes: 10
      candidate_ttl_hours: 1

# 角色 → 逻辑音色配置映射（V2）
# 校园分支：树莓娘（paimeng 克隆）+ 四配角（内置音色克隆）走本地
# tts-server；键名任意（工厂按 name 匹配说话人显示名）。
characters:
  raspberry:
    name: 树莓娘
    voice_profile: raspberry_main
  xuwanqing:
    name: 许晚晴
    voice_profile: xuwanqing_main
  linxiaoman:
    name: 林小满
    voice_profile: linxiaoman_main
  xiayiming:
    name: 夏一鸣
    voice_profile: xiayiming_main
  hanche:
    name: 韩澈
    voice_profile: hanche_main

game:
  history_events: 180
  sessions_dir: sessions
  show_line_ids: false

# 可观测性：写手 DSL 流全量落盘（<sessions_dir>/<sessionId>/llm/）。
# /monitor 只有有界内存视图（ring + 截断），落盘器把每次生成的输入
# prompt 与输出流逐字节留档，事后可审计；含中途死亡的 attempt 现场。
observability:
  record_llm_streams: true

# 叙事模式：校园分支使用 event 模式（每局一个叙事种子，按三级收束节奏结束）。
narrative:
  # event = 不组装长线 narrative director；每局从 campus-ops.yaml 的
  # 叙事种子开始（按 sessionId 确定性选种，CAMPUS_SCENARIO_SEED_ID 可显式指定）。
  mode: event
  # 分级收束（全部提示词层面加压，尽量避免运行时硬上限）：
  #   wrapup_interactions（L1，默认 6）：达到后续写附"进入收束阶段"软提示；
  #   closing_push_interactions（L2，默认 8）：达到后附"不再开新交互、直接收束"
  #     强提示，并停止分支预取；
  #   max_interactions（L3 保险丝，默认 10）：达到后才启用运行时强制收束
  #     （endingRequired + 合成结局兜底），正常加压下不应触达。
  # 各级 0 = 禁用；启用项之间必须非递减（L1 ≤ L2 ≤ L3）。
  event:
    wrapup_interactions: 3
    closing_push_interactions: 6
    max_interactions: 8
    # 长回合护栏：单回合模型文本事件超过该数后，续写附"尽快打开交互表单"
    # 软提示（0 = 禁用）。防止整回合连写数分钟不交还玩家。
    # 2026-09-17 审计：24 过松（实测出现 31 条文本的段），收紧到 10。
    max_events_between_interactions: 10
  threads:
    max_major_active: 2
    max_minor_active: 3
  setups:
    max_active: 6
  consolidation:
    batch_min_events: 4
    max_events_per_call: 80
    min_checkpoint_gap_ms: 5000
  brief:
    max_relevant_episodes: 6
  plan:
    # 一份导演计划的 horizon（未来几个 checkpoint 内有效）；到期前 replan_ahead 个 checkpoint 提前后台重规划
    horizon_checkpoints: 3
    replan_ahead_checkpoints: 1
  story_plan_path: story-plan.yaml

debug:
  runtime_status: true
