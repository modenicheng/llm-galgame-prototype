app:
  default_host: web

local_web:
  host: 127.0.0.1
  port: 0
  open_browser: true
  controller_limit: 1

api:
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  timeout_ms: 60000
  token_limit_field: max_completion_tokens

generation:
  temperature: 0.9
  max_tokens: 1400
  repair_attempts: 2

prefetch:
  branch_dialogue_lines: 3
  branch_concurrency: 3
  input_bridge:
    enabled: true
    min_events: 1
    max_events: 2
    only_narration: true

input:
  kind: dialogue
  require_preview_confirmation: true
  show_generation_status: false

interaction:
  allowed_modes:
    - choice
    - hybrid
    - input

  default_mode: hybrid

  options:
    min_count: 2
    max_count: 5

  input:
    max_length: 500
    max_consecutive_pure_input: 1

  legacy_choice:
    allow_runtime_compatibility: true
    allow_model_output: false

media:
  audio:
    # V1 遗留平面字段：保持默认，CLI 行为不变（enabled=false 不等待音频）。
    enabled: false
    provider: disabled

    planner:
      candidate_prefetch_lines: 1
      max_active_future_lines: 4

    playback:
      # 每句角色音频开播前的固定延迟，用于同步视觉与听觉（0 = 不延迟）。
      # 若发现配音比字幕快/慢，可在此微调。
      voice_delay_ms: 500
      startup_buffer_ms: 350
      critical_watermark_ms: 500
      low_watermark_ms: 2500
      target_buffer_ms: 6500

    synthesis:
      # V2 权威开关：web 模式从这里读取 provider（dashscope / mock / disabled）。
      provider: dashscope
      max_concurrency: 2
      model_profile: cosyvoice_v3_flash
      api_key_env: DASHSCOPE_API_KEY
      format: pcm_s16le
      sample_rate: 22050

    cache:
      max_bytes: 536870912
      cleanup_target_bytes: 402653184
      write_batch_bytes: 262144
      write_flush_interval_ms: 300
      partial_ttl_minutes: 10
      candidate_ttl_hours: 1

# 角色 → 逻辑音色配置映射（V2）
# key 用角色显示名（LLM 的 speaker 输出），value.name 用于展示。
# 缺任一角色 → 该角色台词静音（build-skip no-character）。
characters:
  苏遥:
    name: 苏遥
    voice_profile: suyao_main
  林澈:
    name: 林澈
    voice_profile: linche_main

game:
  history_events: 80
  sessions_dir: sessions
  show_line_ids: true

debug:
  runtime_status: true
