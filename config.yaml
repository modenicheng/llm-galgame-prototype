app:
  default_host: web

local_web:
  host: 127.0.0.1
  port: 0
  open_browser: true
  controller_limit: 1

api:
  # OpenAI 兼容中转（new-api 网关）；key 在 .env 的 OPENAI_API_KEY
  model: deepseek-v4-flash-0731
  base_url: https://new-api.honahec.cc/v1
  # 注意：不要用 OPENAI_API_KEY——系统环境变量里可能残留旧值且 dotenv 不覆盖已存在的变量
  api_key_env: VIBEGAL_LLM_KEY
  timeout_ms: 60000
  # 中转网关统一用 max_tokens（若长段结尾频繁截断可尝试换回 max_completion_tokens）
  token_limit_field: max_tokens

generation:
  temperature: 0.9
  # 1400 常在长段结尾截断（无 @end）导致整段判失败；2200 给模型足够预算
  max_tokens: 2200
  repair_attempts: 2

# 文本缓冲阈值（docs §74）：播放达到两句即可开始；正常保持六句未来内容；只剩三句时启动续写
text_buffer:
  start_threshold_lines: 2
  target_lines: 6
  refill_threshold_lines: 3

# 资源目录（docs §57）：角色绑定、背景/BGM/立绘等资源描述
assets:
  catalog: assets/resources.yaml

prefetch:
  branch_dialogue_lines: 3
  branch_concurrency: 3
  input_bridge:
    enabled: true
    min_events: 1
    max_events: 2
    only_narration: true

input:
  kind: dialogue
  require_preview_confirmation: true
  show_generation_status: false

interaction:
  allowed_modes:
    - choice
    - hybrid
    - input

  default_mode: hybrid

  options:
    min_count: 2
    max_count: 5

  input:
    max_length: 500
    max_consecutive_pure_input: 1

media:
  audio:
    planner:
      candidate_prefetch_lines: 1
      max_active_future_lines: 4

    playback:
      # 每句角色音频开播前的固定延迟，用于同步视觉与听觉（0 = 不延迟）。
      # 若发现配音比字幕快/慢，可在此微调。
      voice_delay_ms: 500
      # 开播前固定延迟：给语音合成开头留自然停顿，避免听感突兀（语音为预合成）
      startup_buffer_ms: 350
      critical_watermark_ms: 500
      low_watermark_ms: 2500
      target_buffer_ms: 6500

    synthesis:
      # V2 权威开关：web 模式从这里读取 provider
      # （dashscope / local / mock / disabled）。
      # 当前 disabled = 纯文本运行（.env 未配 DASHSCOPE_API_KEY / voice-id；
      # 配好后改回 dashscope 即可启用语音）。
      # local = 本机 Qwen3-TTS 推理服务（voices.yaml 的 providers.local，
      # 固定 24000 Hz 输出——启用时下方 sample_rate 必须改 24000，
      # 启动校验拦截；详见 docs/agents/TTS-音色配置指南.md 本地合成章节）
      provider: disabled
      max_concurrency: 2
      model_profile: cosyvoice_v3_flash
      api_key_env: DASHSCOPE_API_KEY
      format: pcm_s16le
      sample_rate: 22050

    cache:
      max_bytes: 536870912
      cleanup_target_bytes: 402653184
      write_batch_bytes: 262144
      write_flush_interval_ms: 300
      partial_ttl_minutes: 10
      candidate_ttl_hours: 1

# 角色 → 逻辑音色配置映射（V2；M1 起为 author 兼容视图）
# key 只用稳定内部 characterId（按 ID join）。中文显示名别名副本已随 M1
# 移除——角色到 profile 的权威绑定由根目录 characters.yaml 名册给出，
# 两侧冲突会在装配期大声报错（禁止 last-wins）。缺任一角色 → 该角色
# 台词静音（build-skip no-character）。
game:
  sessions_dir: sessions
  show_line_ids: true

# 叙事导演配置（narrative director）：长线剧情线程、场景搭建、记忆整合与简报。
narrative:
  mode: longform
  # 活动模式策略：max_interactions=0 表示不限制；>0 时到达上限后强制收束结局。
  event:
    max_interactions: 0
  threads:
    max_major_active: 2
    max_minor_active: 3
  setups:
    max_active: 6
  consolidation:
    batch_min_events: 4
    max_events_per_call: 80
    min_checkpoint_gap_ms: 5000
  brief:
    max_relevant_episodes: 6
  plan:
  confluence:
    # M2.2 场景内汇流：边收束后由 LLM 判定员在后台比较新边末态与同场景既有
    # 节点入口态（「从此分叉继续，故事是否会一样？」），命中即把边改指既有
    # 节点并落盘判定凭据。异步执行，不阻塞生成/播放。
    enabled: true
  story_plan_path: story-plan.yaml

debug:
  runtime_status: true
