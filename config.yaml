app:
  default_host: web

local_web:
  host: 127.0.0.1
  port: 0
  open_browser: true
  controller_limit: 1

api:
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: OPENAI_API_KEY
  timeout_ms: 60000
  token_limit_field: max_completion_tokens

generation:
  temperature: 0.9
  # 1400 常在长段结尾截断（无 @end）导致整段判失败；2200 给模型足够预算
  max_tokens: 2200
  repair_attempts: 2

# 文本缓冲阈值（docs §74）：播放达到两句即可开始；正常保持六句未来内容；只剩三句时启动续写
text_buffer:
  start_threshold_lines: 2
  target_lines: 6
  refill_threshold_lines: 3

# 资源目录（docs §57）：角色绑定、背景/BGM/立绘等资源描述
assets:
  catalog: assets/resources.yaml

prefetch:
  branch_dialogue_lines: 3
  branch_concurrency: 3
  input_bridge:
    enabled: true
    min_events: 1
    max_events: 2
    only_narration: true

input:
  kind: dialogue
  require_preview_confirmation: true
  show_generation_status: false

interaction:
  allowed_modes:
    - choice
    - hybrid
    - input

  default_mode: hybrid

  options:
    min_count: 2
    max_count: 5

  input:
    max_length: 500
    max_consecutive_pure_input: 1

media:
  audio:
    # V1 遗留平面字段：保持默认，CLI 行为不变（enabled=false 不等待音频）。
    enabled: false
    provider: disabled

    planner:
      candidate_prefetch_lines: 1
      max_active_future_lines: 4

    playback:
      # 每句角色音频开播前的固定延迟，用于同步视觉与听觉（0 = 不延迟）。
      # 若发现配音比字幕快/慢，可在此微调。
      voice_delay_ms: 500
      # 开播前固定延迟：给语音合成开头留自然停顿，避免听感突兀（语音为预合成）
      startup_buffer_ms: 350
      critical_watermark_ms: 500
      low_watermark_ms: 2500
      target_buffer_ms: 6500

    synthesis:
      # V2 权威开关：web 模式从这里读取 provider（dashscope / mock / disabled）。
      # 校园分支：文本优先，展位不依赖 DASHSCOPE_API_KEY；接入树莓娘音色后再启用。
      provider: disabled
      max_concurrency: 2
      model_profile: cosyvoice_v3_flash
      api_key_env: DASHSCOPE_API_KEY
      format: pcm_s16le
      sample_rate: 22050

    cache:
      max_bytes: 536870912
      cleanup_target_bytes: 402653184
      write_batch_bytes: 262144
      write_flush_interval_ms: 300
      partial_ttl_minutes: 10
      candidate_ttl_hours: 1

# 角色 → 逻辑音色配置映射（V2）
# 校园分支（campus-ops-raspberry）：树莓娘音色尚未确认，
# 展位采用文本优先模式（synthesis.provider: disabled），
# 音频关闭时此映射不参与合成；确认音色后再新增独立 profile。
characters: {}

game:
  history_events: 80
  sessions_dir: sessions
  show_line_ids: true

# 叙事模式：校园分支使用 event 模式（每局一个叙事种子，不限制互动次数）。
narrative:
  # event = 不组装长线 narrative director；每局从 campus-ops.yaml 的
  # 叙事种子开始（按 sessionId 确定性选种，CAMPUS_SCENARIO_SEED_ID 可显式指定）。
  mode: event
  # 活动模式策略：max_interactions=0 表示不限制；>0 时到达上限后强制收束结局。
  event:
    max_interactions: 0
  threads:
    max_major_active: 2
    max_minor_active: 3
  setups:
    max_active: 6
  consolidation:
    batch_min_events: 4
    max_events_per_call: 80
    min_checkpoint_gap_ms: 5000
  brief:
    max_relevant_episodes: 6
  plan:
    # 一份导演计划的 horizon（未来几个 checkpoint 内有效）；到期前 replan_ahead 个 checkpoint 提前后台重规划
    horizon_checkpoints: 3
    replan_ahead_checkpoints: 1
  story_plan_path: story-plan.yaml

debug:
  runtime_status: true
