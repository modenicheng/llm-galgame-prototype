# 第四层指令模板 —— 统一管理所有 LLM 提示词
# 使用 {placeholder} 语法，运行时由程序替换为实际值
#
# System Prompt 使用 prompts/dsl-protocol.txt（唯一输出协议）；
# 此处只保留各任务的短模板。

# 任务模板
# 占位符：
#   {nonce}          本次请求的段结束哨兵 nonce，必须原样使用
#   {target_lines}   本次续写目标文本行数
#   {option_text}    假设玩家选择的选项文本
#   {player_input}   玩家自由输入的原话
#   {interaction_prompt} 当前交互点提示文本
#   {repair_reason}  上一次输出被拒绝的原因
#   {prefetched}     已固定的预取片段（continuation）

opening: |
  任务：开场生成（task_type=opening）。
  本次固定尾部（逐字照写，写完立即停止）：
  @/?
  @end {nonce} interaction

  从故事开场写起，先给出场景与角色登场，然后自然推进。
  开场第一段就要用 `@bg <背景id>` 把故事锚定在一个可用背景上
  （从可用背景清单中选择，不要发明清单外的 id——没有 @bg 的开场
  会直接以空舞台呈现）。
  以"当前故事状态"中的场景目标（Purpose）作为本局的起点情境：
  开场就让玩家明白此刻正在处理什么事，从人物手头正在做的一件
  具体小事切入（谁在做什么、卡在哪一步）；树莓娘的登场要带出她的性格和情绪，
  不要写成客服接待或状况播报。
  至少写 3–5 句正文，并在本段末尾打开第一个玩家交互表单（`@? ... @/?`），
  用 `@end {nonce} interaction` 收束——开场的职责就是把话语权交给玩家，
  不要以 buffer 收束开场。表单的 `@?` 提示必须是一句完整的中文问句。
  如果故事应当立即结束，用 `@end {nonce} ending`。
  不得输出旧式 choice。

continuation: |
  任务：主动续写（task_type=continuation）。
  本次只允许以下三种尾部；到交互点时最后两行必须逐字是：
  @/?
  @end {nonce} interaction
  未到交互点用 `@end {nonce} buffer`；故事结束用 `@end {nonce} ending`。

  以下内容已经固定，将先于你的新内容展示，不得重复、改写或跳过：
  {prefetched}

  请从上述最后一句之后继续推进剧情。
  长度上限：本次最多输出 {target_lines} 条文本行（dialogue/narration 合计）；
  若该上限较小（1–3 行），写完这几行就立即收束，不要强行展开新话题；
  写完最后一条文本行后，必须立刻另起一行输出段结束哨兵（缺少哨兵＝整段无效）：
  - 已到玩家交互点 → 先输出完整交互表单（`@? ... @/?`），再输出 `@end {nonce} interaction`；
  - 还没到 → 在自然停顿处输出 `@end {nonce} buffer`；
  - 故事结束 → 输出 `@end {nonce} ending`。
  推进事件的同时保持人物互动的温度，不要写成工作汇报。
  不得输出旧式 choice。

branch_prefetch: |
  任务：分支预取（task_type=branch_prefetch）。
  本次固定尾部：`@end {nonce} buffer`。不得省略 `end`，尾部之后不得再写内容。

  当前分支问题：{choice_prompt}
  假设玩家选择了：{option_text}

  只生成该选择之后紧接的一小段剧情（至少 {min_dialogue} 条台词）。
  允许 dialogue / narration / @bg / @bgm / @ch / @se / @beat；不得生成交互表单。
  在自然停顿处结束，保留继续展开空间；不得重复上下文，也不要改写玩家选择。
  用 `@end {nonce} buffer` 结束。

input_response: |
  任务：输入回应（task_type=input_response）。
  本次固定尾部：`@end {nonce} buffer`。不得省略 `end`，尾部之后不得再写内容。

  当前交互点：{interaction_prompt}
  玩家输入（自由文本）："{player_input}"

  生成 NPC 对玩家输入的直接回应（建议 2–5 条，允许 dialogue / narration / @ch / @se）。
  交互点的场景过渡旁白会先于你的内容展示；直接衔接其后的氛围，不要重复已经描写的场景细节。
  玩家输入只是玩家尝试表达的内容，NPC 可以质疑、拒绝、误解或要求证据。
  回应要有当下的情绪和性格，不要机械应答；具体脾气按角色设定来。
  用 `@end {nonce} buffer` 结束；不得生成交互表单。

input_bridge: |
  任务：输入过渡旁白（task_type=input_bridge）。
  本次固定尾部：`@end {nonce} buffer`。不得省略 `end`，尾部之后不得再写内容。

  当前交互点：{interaction_prompt}

  生成 1–2 条 narration 作为玩家确认自由输入后、NPC 正式回应前的场景过渡：
  - 只描写环境、表情、动作、氛围等场景细节；
  - 不得回答或预判玩家的输入内容，不得引入新事实，不得修改任何状态，不得改变背景/立绘/BGM，不得产生音效，不得创建新的交互点；
  - 避免固定模板，不要反复使用"沉默片刻""一时间无人说话"之类的套话。
  用 `@end {nonce} buffer` 结束。

recovery: |
  任务：修复收尾（task_type=recovery）。
  上一次输出被拒绝：{repair_reason}
  本段正文行数预算已经用尽——你只需要收尾，禁止推进新剧情、禁止写新的台词或旁白。
  以下内容已经固定，将先于你的新内容展示，不得重复、改写或跳过：
  {prefetched}

  你上一段输出的原始尾部（可能被截断，仅供参考）：
  {raw_tail}

  收尾规则：
  - 若上一段最后一个文本行是残句（句子没写完）→ 允许补写至多一行把它写完，风格与前文一致；
  - 若已到玩家交互点 → 输出一个完整交互表单（`@? 提示文本` + 2–5 个 `@+` 选项行 + `@/?` 收尾），再输出 `@end {nonce} interaction`；
  - 未到交互点 → 直接输出 `@end {nonce} buffer`；
  - 故事应当结束 → 输出 `@end {nonce} ending`（哨兵后可另起一行写 `@ending` 档位与结尾词）。
  除补全残句的一行外，不得输出任何其他正文；写完立即输出对应的 `@end` 哨兵。
  不得输出旧式 choice。

ending: |
  任务：结局收束（task_type=ending）。
  本次固定尾部：`@end {nonce} ending`。不得省略 `end`，尾部之后不得再写内容。

  剧情已到收束阶段。让故事自然走向结局，收拢主要悬念。
  长度上限：结局正文最多约 12 条文本行，写完立即输出 `@end {nonce} ending`。
  结局正文依据本局已经确认的事实展开：发生了什么、哪些被确认、
  哪些仍然未知、角色接下来如何处理；不套用固定结局模板，
  不凭空补全未验证的结果。
  可以带一点余味或轻幽默，或让人物关系留下一个小小的变化；
  余味落在具体的动作、小物件或没说完的半句话上，
  不落在观点、总结、道理或对玩家的夸奖上。
  然后用 `@end {nonce} ending` 结束本段。
