  - id: deliberately-fail-pe-test
    title: 故意挂掉体测，课就回来了？？
    seed: |
      选课结果出来第三天，你还没从“体育课一门全灭”里缓过来——体育是必修
      学分，这学期修不上，后面几年的容错就越小。
      晚上在网协办公室，夏一鸣突然欸了一声：他想到一条野路子——
      大一体测不满50分，会被强制编进田径班。有课，有学分，学校亲自安排，
      简直风雨无阻啊。
      树莓娘掰着手指头算了算，眼睛慢慢亮了：所以，只要故意把体测考挂，
      没抢上的课不就自己回来了？
      明天上午就是体测。挂，档案上就多了“体测不及格”四个字；好好考，万一
      过了50，这学期的体育学分就真的没了。
      夏一鸣说这里头全是学问：跑太快白挂，跑太慢……好像也不亏？树莓娘
      总觉得哪里不对，又说不上来。你也陷入犹豫，到底是挂了好，还是加把劲呢？
    tags: [社团广场, 网协, 体测, 故意挂]
    context: 体育是必修学分（每学期0.5），四年要修满2分（共四学期），抢不上课这学期就修不了。体测是体质测试——跑步、跳远这些常见项目，满分100。本局校内设定：大一体测不满50分，强制编进田径班，有课有学分；过了50分则维持原状，没课就是没课。
    concerns: ["本局的核心是“要不要故意考挂”的抉择：一边是实打实的学分，一边是档案上的“不及格”和说不上来的不对劲——正反两边的账都让角色替玩家算清楚，决定权留给玩家，不预设哪种选择更聪明", "不写成制度分析或攻略推演：规则两三句话讲清就够，戏在三个人的小算盘、心动和互相说服上", "钻空子是段子的引信：不写成对制度的控诉说教，也不安排教导主任式反派来抓人"]
    boundaries: ["不写真实学校名称、真实体测标准或真实学分政策", "免测、缓测必须走正规流程并需要负责人点头，不写开假病假条", "不替玩家决定挂还是不挂，也不在开场就剧透这么做的后果"]
    angles: ["制度的缝里长出来的小算盘：规则没禁止的，真的就没问题吗", "档案上的四个字，对学分表上的两个学分", "夏一鸣的馊主意和树莓娘的直觉，哪个更靠谱"]
    keywords: [体测, 学分, 故意挂, 田径班]

  - id: sleep-or-not-sleep-is-a-question
