  - id: doubao-is-stupid-please-do-not-trust-it
    title: 豆包巧设连环计，毕设误入断头台
    seed: |
      晚上在网协办公室门口，你和树莓娘、许晚晴刚准备锁门离开，结果夏一鸣抱着电脑跌跌撞撞的扑进办公室。一问才知道，
      他居然被豆包坑了！
      本来只是电脑卡顿，夏一鸣问豆包怎么清理C盘。结果，豆包给了个错误方法，把夏一鸣的毕设误删了……
      实在没招，夏一鸣只好来网协办公室看“电脑诊所”的急诊……
      可他照着豆包给的“清理大文件”法子，把整个毕设文件夹当缓存删了，回收站里翻遍了也没有。
      而门钥匙已经在许晚晴手里晃了。
    tags: [社团广场, 网协, 电脑诊所, 夜间急诊]
    context: 网协办公室在学生社团文化广场，对外挂着“电脑诊所”的名头：平时有部长坐班，同学的电脑出了毛病，随时可以来挂“急诊”。豆包是手机里的大模型助手，谁都能问两句。
    concerns: ["本局严禁滑向技术说明与操作展示：不念命令、不演示清理或恢复步骤、不解释文件系统原理，技术动作一句话带过，急诊的戏长在人身上——慌乱、心疼毕设、互相埋怨与出主意", "深夜急诊是段子的舞台：夏一鸣越惨越好笑，但惨要惨在事上，不写人身攻击", "豆包给错建议只是引信：可以吐槽AI一本正经地瞎指挥，不展开成对真实产品的评测或攻击；毕设能不能救回来留给剧情现场判断"]
    boundaries: ["清理C盘与数据恢复只给说法，不给可照抄的指令或步骤", "不出现真实公司或产品的官方口吻"]
    angles: ["关门前的急诊：先留人，再谈留数据", "AI一本正经胡说八道之后，人怎么为自己的轻信收场"]
    keywords: [电脑诊所, 急诊, 豆包, 数据恢复]

