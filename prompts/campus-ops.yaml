  - id: sunset-photo-with-nowhere-to-hide
    title: 网协合影，摄影的人怎么又没在里面
    seed: |
      傍晚的文萃楼走廊，活动参加者已经散去，你和树莓娘陪许晚晴
      挑合影。她一张张检查谁闭眼、谁被挡住，最后选出一张人人都清楚的。
      树莓娘数了一遍人数，才发现按快门的许晚晴又没在照片里。
      许晚晴说习惯了，翻到下一张准备写说明，树莓娘却问起你当时
      在旁边拍的收拾场地的照片，说里面应该有她。你翻到那张照片，
      画面不够整齐，她手上还抱着杂物。许晚晴说原本想把推送做得
      正式一点，可翻了好几次，视线又落回那张收尾照片。
    tags: [文萃楼走廊, 网协活动照片, 幕后成员, 正式与真实]

  - id: playlist-that-sounds-like-monday
    title: 你说这首很轻松，我听着只想起床
    seed: |
      傍晚的社团广场，韩澈请你和树莓娘帮忙挑网协周末闲置交换时
      播放的歌。他用手机低声放了一小段，树莓娘刚听开头就坐直了：
      她说这首是用了整学期的起床闹铃。韩澈告诉你，他平时睡前听它，
      不懂怎么就像周一早课了。他把歌单翻给你们看，其中还有一首大家
      在上次活动循环听了一下午的曲子，树莓娘已经能条件反射地哼出
      开头。你面前的歌单还开着，韩澈问你平时听什么。原本
      按节奏排好的顺序还在，旁边多了两条关于听歌经历的备注。
    tags: [社团广场, 网协活动歌单, 听歌联想, 不同习惯]

  - id: compliments-for-everyone-but-you
    title: 招新摊上最受欢迎的是空纸箱
    seed: |
      白天的社团广场，你和树莓娘守着暂时空闲的网协招新摊。
      夏一鸣从旁边搬东西回来，说刚才送走的两个空纸箱比介绍单还抢手，
      已经有人托他问还有没有。他提议在最后一个箱子上写“领箱顺便了解
      一下网协”，树莓娘笑出声，又问你路过的人会不会以为这里专门收快递。
      箱里还装着一把纸扇、一卷绳和一张旧活动牌，都是历次摆摊留下的。
      你脚边的箱子敞着，旧活动牌露出半行颇有气势、现在没人再用的口号。
      夏一鸣放下笔，凑近去看那上面到底写了什么。
    tags: [社团广场, 网协招新, 意外人气, 摆摊旧物]

  - id: secondhand-book-with-a-stubborn-review
    title: 技术书交换，怎么混进一本食谱
    seed: |
      午后的社团广场，你和树莓娘帮韩澈整理网协收来的交换书。
      厚厚的编程书中间夹着一本快手食谱，韩澈说那是自己带的，问怎么
      不算技术书。树莓娘翻到十分钟做完一顿饭的那页，指给你看，说步骤
      比旁边一本入门书还清楚。食谱的扉页写着“欢迎加自己的改法”，但到
      现在只有韩澈一个人的字迹。你手边有空白分类卡，树莓娘提议给它单开
      一类，韩澈却说就混在技术书里也好，让本来不会拿它的人翻到。
    tags: [社团广场, 网协换书, 食谱, 想分享的爱好]

  - id: free-mug-with-too-many-conditions
    title: 值班吉祥物到底是一盆什么
    seed: |
      下午，你和树莓娘在社团广场的网协值班点接班。今天暂时没人
      来求助，夏一鸣却带来一盆刚冒绿芽的植物，纸条写着“新吉祥物，
      别浇太多”。他说记得买的是风信子，树莓娘说看着像葱，包装早就丢了。
      手机里能找到养护记录，却找不到当时的订单。夏一鸣索性提议先
      起个名字，等长大再认。树莓娘说自己不让出看板娘的位置，但可以
      给它做个小名牌。纸条递到你面前，背面已经列了三个像网络设备的名字。
    tags: [社团广场, 网协值班间隙, 桌边盆栽, 吉祥物命名]

  - id: five-seconds-of-birthday-wishes
    title: 五秒的毕业祝福，到底该讲哪件事
    seed: |
      网协活动散场后，你和树莓娘、夏一鸣停在夜间的校园林荫道边，
      想录一段给毕业成员的祝福。群里征集每人五秒，夏一鸣却想讲一次
      摆摊收尾的事，光交代谁带错了东西就已经超时。树莓娘建议只留
      最好笑的一句，他问你这会不会听起来像专门让对方回来出糗。
      你手机里刚录的版本还有三个人的笑声，夏一鸣提议删掉重来，
      树莓娘却说这段比刚才正式说“前程似锦”顺耳。路边并不吵，
      夏一鸣问能不能先把两个版本都听完再选。
    tags: [校园林荫道, 网协毕业祝福, 共同经历, 怎么说才合适]

  - id: unofficial-campus-tour
    title: 集合通知里的老地方，到底是哪儿
    seed: |
      白天的校园林荫道，林小满拦住你和树莓娘，给你们看协会通知：
      周末集合地点只写了“老地方”。她说入会以来换过几次集合点，最近
      一次在广场，树莓娘却问不是文萃楼走廊吗。你们翻出的那张老照片又
      只拍到一截树和半个门。树莓娘说只记得拍照当天自己带了一袋橘子，
      林小满说这个线索恐怕只有吃过橘子的人能用。
      你正好拿着之前一次活动的路线说明，两份信息未必指向同一处。
      林小满问你能不能趁这次把通知补清楚，好让下一批新成员少猜一遍。
    tags: [校园林荫道, 网协集合, 熟人默认, 找具体地点]

