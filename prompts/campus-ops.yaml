  # 研究启发：课程收获、成绩目标和“适不适合自己”可以同时成立。
  - id: course-review-has-two-scores
    title: 课程评价里写着两个“好”
    seed: |
      下午的校园林荫道，你和树莓娘陪韩澈看一门下学期课程的公开评价。
      有人夸它讲得清楚、例题有意思，也有人提醒想稳住成绩要留出复习时间。
      树莓娘先把“值得上”圈起来，又在旁边写了一个大大的问号，问你同一门课
      怎么能既推荐又劝人想清楚。韩澈没有替她下结论，只把自己的选课草稿
      翻到背面，写下“我想学什么”和“我这学期能花多少时间”。你手机上
      还停在课程介绍页，树莓娘凑过来问你在看哪一项。
    tags: [校园林荫道, 网协学习闲聊, 课程评价, 选课取舍]
    context: 公开评课中同时出现授课收获、成绩压力与个人适配度的不同关注。
    concerns: [课程好坏不能只用一个总分概括, 不替玩家决定是否选课]
    boundaries: [不虚构具体学校、教师或统一的给分结论, 不把匿名个别意见写成普遍事实]
    angles: [兴趣和绩点目标的差异, 把“适合谁”说具体]
    keywords: [课程评价, 选课, 学习目标, 时间预算]

  - id: open-book-exam-index
