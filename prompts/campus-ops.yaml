  - id: rehearsal-for-an-audience-of-two
    title: 介绍网协一分钟，开场白改了八次
    seed: |
      白天的文萃楼走廊，同学丙为新成员见面会练开场白，请玩家和树莓娘
      帮忙听一遍。他想显得轻松些，第一句却是“尊敬的各位来宾”。
      树莓娘没忍住笑，他索性划掉重来，第二版又像在报菜名，把活动
      一口气列了十项。树莓娘让他就照平时拉人入群那样讲，他问那句
      “来都来了，坐会儿呗”真的能用吗。旁边的同学乙听见，表示自己
      去年还真就是被这句话留下的。同学丙握着笔，不知道该不该把它写上去。
    tags: [文萃楼走廊, 网协见面会, 开场练习, 熟人证词]

  - id: lost-and-found-with-a-strange-description
    title: 同款挂件，背面各有黑历史
    seed: |
      网协活动散场后的文萃楼走廊，同学甲捡到一个兔子挂件，在群里
      发了半张照片请人认领。树莓娘和同学乙同时伸手：上次协会手工
      小活动做的都是同款，连剪歪的耳朵都很像。同学甲问背面写了什么，
      树莓娘说自己的是“本周绝不熬夜”，同学乙的是“再买键帽就剁手”。
      玩家记得昨晚群里这两个人都还在聊天。同学甲忍着笑把挂件翻面，
      却先看见一张后来贴上的小纸片，只露出下面原字的一角。
    tags: [文萃楼走廊, 网协小纪念品, 失物招领, 说过的大话]

  - id: sunset-photo-with-nowhere-to-hide
    title: 网协合影，没有一张全员睁眼
    seed: |
      傍晚的文萃楼走廊里，玩家和几位网协成员挑刚拍的活动合影。
      同学甲连拍了十几张，每张都有人闭眼。同学丙觉得第一张最好，
      树莓娘把照片放大，指出他当然满意，因为只有他正好看镜头。
      同学乙提议选最自然的一张，那张却是大家一起看向突然打喷嚏的
      树莓娘。她同意留着自己看，但不想拿它做活动推送。窗外光线还好，
      人也没走散，同学甲问要不要再来一次，几个刚放下的包又被拎了起来。
    tags: [文萃楼走廊, 网协合影, 表情失控, 照片选择]

  - id: the-person-who-keeps-coming-back
    title: 零基础欢迎，但里面在说什么
    seed: |
      晚上的文萃楼走廊，玩家和树莓娘遇到来参加网协交流的新成员同学丁。
      他已经在门外经过三次，手机里存着“零基础也欢迎”的通知，门内
      却一直有人讲他没听过的词。他担心一进去就会被问会什么。
      树莓娘说上周大家聊得最久的其实是键盘清洁，讲到最后发现谁都
      没洗过键帽。同学丁笑了，又认真问她第一次来时怎么介绍自己。
      她承认当时连群昵称都报错了，正说着，同学丙从门边探头问人在等谁。
    tags: [文萃楼走廊, 网协新成员, 门外犹豫, 入会糗事]

  # 社团广场：招新、值班空档和协会成员的闲置物品。
  - id: compliments-for-everyone-but-you
    title: 招新摊上最受欢迎的是空纸箱
    seed: |
      白天的社团广场，网协招新摊上的介绍单暂时没人翻，装贴纸的空
      纸箱却吸引了路过的同学乙。她问能不能拿去装书，树莓娘答应后，
      又有人来问还有没有。同学丙半开玩笑地想把牌子改成“网协纸箱配送”，
      同学甲则觉得不如在箱上写句招新介绍。树莓娘拿起笔，写了“欢迎
      来玩”，又担心别人真以为协会天天在发箱子。玩家脚边还有最后
      一个箱子，里面塞着大家各自带来的东西，谁也没认全。
    tags: [社团广场, 网协招新, 意外人气, 临时点子]

  - id: secondhand-book-with-a-stubborn-review
    title: 技术书交换，怎么混进一本食谱
    seed: |
      午后的社团广场，几位网协成员把闲置书摆出来互换。厚厚的编程书
      中间夹着一本宿舍快手食谱，同学丁坚持这也是技术书，树莓娘立刻
      翻到“十分钟完成”的那页。同学丙抱着自己带来的算法书，发现大家
      全围着食谱看，忍不住问有没有人对他的书感兴趣。玩家翻开算法书，
      里面掉出一张同学丙写的纸条：“第三章看不懂，先吃饭。”
      树莓娘问这算不算两本书的共同主题，同学丁已经开始推荐第一道菜。
    tags: [社团广场, 网协换书, 技术兴趣, 食谱抢镜]

  - id: portrait-that-looks-too-honest
    title: 招新海报上的兔子像谁画的
    seed: |
      傍晚的社团广场，网协几个人围着同学甲的海报草稿提意见。
      树莓娘觉得角落的兔子太困，同学丙觉得正好符合自己参加早场活动
      的样子。同学甲索性给每人一张纸，让大家画一只精神点的。
      玩家刚拿到笔，树莓娘已经画完，自信地把纸翻过来，却被同学乙
      问这是不是长耳朵的土豆。同学丙画的更像插头，还说这才有协会特色。
      原本只是看草稿，桌上现在摊着好几张没人愿意先撤回的画。
    tags: [社团广场, 网协宣传, 海报涂鸦, 审美分歧]

  - id: free-mug-with-too-many-conditions
    title: 值班吉祥物到底是一盆什么
    seed: |
      下午，玩家和树莓娘在社团广场的网协值班点接班。今天暂时没人
      来求助，桌边却多了一盆葱，纸条写着“新吉祥物，别浇太多”。
      同学丙交班时坚持这是蒜苗，同学乙发来的购买记录又写着风信子。
