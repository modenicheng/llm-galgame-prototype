  - id: replacement-course-before-deadline
    title: 替代课程先别急着退
    seed: |
      午后的文萃楼走廊，林小满拿着两张课表来找你和树莓娘。
      她指给你看，原本选的一门替代课和另一门必修撞了时间；课程介绍里的
      资料入口和作业提交方式，她说自己也只看懂了一半。
      退补选窗口还没有关，她一会儿说干脆退掉，一会儿又问学分认定是不是要
      重新确认。树莓娘指着她手机里一张去年的截图，问这是不是已经过期，
      林小满立刻把截图收回去，说自己只是想先找一条不用来回跑的办法。
      你手边的通知页面和她刚才说的并不完全一致。
    tags: [文萃楼走廊, 网协选课闲聊, 课表冲突, 信息核对]
    context: 公开评课中出现过替代课程、时间冲突、资料入口和退课取舍等个人经历。
    concerns: [把问题放在信息核对和个人取舍上, 不制造教师或教务的反派]
    boundaries: [不提供真实学校学分政策, 不替玩家作出退课或留课决定]
    angles: [过期截图与当前通知, 课程负担与学分认定的双重顾虑]
    keywords: [替代课程, 课表冲突, 退补选, 学分认定]

  - id: schedule-screenshot-from-last-semester
    title: 课表截图比课表旧一学期
    seed: |
      傍晚的社团广场，你和树莓娘、夏一鸣在活动开始前核对到场时间。
      夏一鸣把一张“这周别忘了上课”的截图发到群里，树莓娘指着上面的
      教室号说眼熟。你看到截图角落的学期还停在上学期。新的课表、课程
      通知和他转来的旧消息挤在同一部手机里，谁也不能只凭印象确认。
      夏一鸣先说包在他身上，下一秒又问你应该看哪一个入口；树莓娘在
      手机里翻出几张时间不同的截图，你看到活动集合时间也被写在了旧图
      旁边。远处的摊位正在收摊，夏一鸣把手机递向你，问按哪份信息走。
