# 校园技术社团值班 —— 叙事种子目录（scenario seed catalog）
#
# 每局只选择一个种子作为本局起点。种子是描述性素材：起始情境、可见异常、
# 少量线索与风险、当事人的处境。它不是剧本、任务清单或状态机——不规定
# 事件顺序、互动轮数、正确路线或结局。运行时由 src/campus/scenario-seeds.ts 加载。
#
# 允许字段：id / title / seed / tags / context / concerns / boundaries /
# angles / keywords。严格校验：任何流程化字段（如 required_rounds、
# success_path、failure_path、ending_count）都会导致启动失败。

version: 1

guidance: |
  种子只提供开场起点。同一种子允许发展出完全不同的故事：快速解决、
  深入排查、误会与和解、帮忙的人情、责任与协作，或留下待查的问题。
  种子里的"人"是故事的主角之一，不只是报修的工单号。

seeds:
  - id: old-device-before-opening
    title: 开场前仍在运行的旧设备
    seed: |
      技术分享会二十分钟后开始，教室角落一台没人认领的旧设备仍在运行。
      它是上一届学长留下的，交接备注只有一句"它比我们资历都老"。
      树莓娘围着它转了两圈，欲言又止——她有点舍不得直接关机，
      但谁也说不准它现在到底该开着还是关着。
    tags:
      - 技术分享会
      - 旧设备
      - 交接不明

  - id: projector-on-but-blank
    title: 投影亮了，但没有画面
    seed: |
      分享会马上开始，投影仪通电、幕布落下，幕布上却一片空白。
      分享人在讲台上一边摆弄翻页笔一边朝值班台张望，观众开始入场。
      备用设备就在脚边——但上次用它闹了洋相，树莓娘有点不敢
      第一个提议换设备，正眼巴巴地等玩家拿主意。
    tags:
      - 技术分享会
      - 现场设备

  - id: slow-computer-no-backup
    title: 电脑很慢，但不能直接重装
    seed: |
      一位同学抱着笔记本电脑来求助，声音发急：下周要交课程设计，
      电脑却越来越慢，资料一份都没备份。他反复念叨"是不是中毒了"，
      准备今晚就重装。树莓娘记得他上周才来过一次，
      那张写着注意事项的便签好像还没被他取走。
    tags:
      - 电脑诊所
      - 数据安全

  - id: link-works-but-should-not-be-public
    title: 链接能打开，但文件不该公开
    seed: |
      大二的小师妹慌慌张张跑来：她把上周活动资料的链接转发给了
      高中同学，现在才发现里面可能有不合适外传的内容，
      又不敢告诉资料的所有者学姐。学姐正在赶另一场活动，
      电话没人接，链接每分钟都还在被转发。
    tags:
      - 校内云盘
      - 隐私

  - id: mirror-sync-looks-done-but-is-not
    title: 镜像源看起来同步了，其实还没有
    seed: |
      值班巡检发现镜像源页面显示"同步成功"，但群里已经有人问
      "版本怎么对不上"。维护镜像的学长去外地实习了，
      只在值班群里留下一句"应该没事"——这句"应该没事"
      现在看起来越来越没底。
    tags:
      - 镜像源维护
      - 排查

  - id: printer-online-but-job-stuck
    title: 打印机在线，但任务没有出来
    seed: |
      诊所的公用打印机显示在线，任务却停在队列里没有输出。
      队伍里那位同学五分钟后要去上课，语气越来越急。
      这是打印机本周第二次这样了——树莓娘坚持认为
      它就是单纯在偷懒，还说这次她一定有证据。
    tags:
      - 电脑诊所
      - 现场压力

  - id: extra-booking-in-the-sheet
    title: 预约表里多出一个人
    seed: |
      诊所预约后台同一时段冒出两条预约：一条备注"帮学妹代约"，
      一条署名学妹本人。当班志愿者只有玩家和树莓娘两个，
      而"代约"到底算不算违规，值班守则里没写。
      学妹本人就在门外探头探脑，看起来有话想说又不好意思说。
    tags:
      - 预约后台
      - 规则与公平

  - id: attachment-uploaded-or-not
    title: 附件上传成功了吗
    seed: |
      面试十分钟后开始，候选人在电话里声音发紧：材料昨晚明明传了，
      面试官那边却看不到。重排面试来不及了，附件里还有个人信息。
      树莓娘隐约记得后台昨晚有过一次维护，但维护记录她还没来得及翻。
    tags:
      - 面试系统
      - 隐私

  - id: every-ticket-is-top-priority
    title: 所有工单都是最高优先级
    seed: |
      任务列表里堆着七张"最高优先级"工单，其中三张的字一模一样，
      大多没有影响范围也没有负责人。写它们的人已经三天没来值班了。
      树莓娘把工单念给玩家听，念到第五张时自己先绷不住笑了——
      但她很快收起笑：这堆"救命"里，可能真有一张是着急的事。
    tags:
      - 任务管理
      - 协作

  - id: still-syncing-after-the-event
    title: 活动结束后仍在同步
    seed: |
      活动散场，教室快到了还给下一场活动的时间，后台却有一个
      不明同步任务占着半条带宽。任务没有署名，交接记录里
      只有神秘的一句"别动它"。树莓娘小声嘀咕：
      "越写'别动它'，是不是越说明有人知道点什么？"
    tags:
      - 校内云盘
      - 资源占用

  - id: handover-note-says-business-as-usual
    title: 交接文档写着"照旧处理"
    seed: |
      新值班的玩家接手时只拿到一句备注："这里照旧处理就行。"
      老学长手机关机，人联系不上。树莓娘翻了翻新规，
      脸色微妙——"照旧"的做法按现在的规定其实已经不行了。
      是照做、等他回消息，还是想别的办法？她把难题推给了玩家。
    tags:
      - 值班交接
      - 责任

  - id: raspberry-girl-unsure-about-shutdown
    title: 树莓娘也不确定该不该关机
    seed: |
      一台无人认领的设备运转正常，用途不明，屏幕上没有报错。
      树莓娘围着它转了两圈，小声说"要不……再等等？"，
      又立刻觉得这么决定太不负责任，于是郑重其事地把选择权
      推给了玩家——顺便把抽屉里的零食分了一半出来当"会议茶点"。
    tags:
      - 旧设备
      - 最小风险
