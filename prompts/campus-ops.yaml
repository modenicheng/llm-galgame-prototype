    concerns: [不把主观评价包装成客观排名, 给玩家留下补充或质疑的空间]
    boundaries: [不复述真实评论、姓名、分数或教师评价, 不写成宣传口号]
    angles: [怎样把“适合谁”说清楚, 事实描述和个人感受的边界]
