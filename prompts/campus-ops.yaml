# 网协成员的校园日常 —— 叙事种子目录（scenario seed catalog）
#
# 每局只选择一个种子作为本局起点。种子是描述性素材：起始情境、人物的
# 小心思、少量线索与悬念。它不是剧本、任务清单或状态机——不规定
# 事件顺序、互动轮数、正确路线或结局。运行时由 src/campus/scenario-seeds.ts 加载。
#
# 允许字段：id / title / seed / tags / context / concerns / boundaries /
# angles / keywords。严格校验：任何流程化字段（如 required_rounds、
# success_path、failure_path、ending_count）都会导致启动失败。

version: 1

guidance: |
  以网络开拓者协会成员之间的日常为主：筹备活动、兴趣交流、值班间隙、
  散场闲聊，也有一起上课、自习、拼单和散步。协会是大家相识、共事和
  积累糗事的地方，技术兴趣可以出现，不必每局都出故障或有人来修电脑。
  趣味来自各人的习惯、偏好、嘴硬和临时起意；只给开场，不规定谁对谁错。
  人物按普通同学、朋友和协会伙伴相处，不写暧昧、恋爱暗示或配对起哄。

  场景以当前注册的文萃楼走廊、校园林荫道、社团广场、阶梯教室为限，
  可按已有昼夜版本自然转换；其他地点可以提及，不必前往。
  纸条、书本、零食、手机照片等小道具由文字呈现，不依赖专用 CG、
  道具贴图、换装或新音效。配角按需使用已注册的同学甲、乙、丙、丁，
  每局的身份独立，不把临时设定沿用到其他种子；下列趣事均属本项目虚构。

seeds:
  # 普通上学日：相熟的网协成员也会一起赶课、复习和纠结午饭。
  - id: saved-seat-with-a-view
    title: 一排熟人，谁坐第一排
    seed: |
      早上的阶梯教室里，几个选了同一门通识课的网协成员凑到一排。
      树莓娘昨天在协会群里拍胸脯说要带头坐前排，今天却熟练地把包
      放在倒数第三排，说这里看黑板角度好。同学乙亮出她昨晚的原话，
      同学丙则表示自己是专门来看看谁真坐前排的。离上课还有1分钟，
      玩家刚到过道，树莓娘赶紧问他能不能看清黑板。同学乙已经拎起包，
      但也没迈步——她原先以为会有人先跟着走。
    tags: [阶梯教室, 网协成员, 早课, 互相拆台]

  - id: breakfast-hidden-in-the-notes
    title: 早饭可以忘，昨天的争论忘不了
    seed: |
      上午课间，玩家和几位网协成员站在文萃楼走廊吃早饭。树莓娘从
      包里摸出一个压扁的面包，又掏出一张写满字的便签：昨晚群里争论
      豆腐脑该吃甜的还是咸的，她搜集了三个同乡的意见，准备继续说。
      同学丙看完表示自己家乡两种都吃，同学乙说她昨天只是在问早餐
      哪里便宜。树莓娘咬了一口面包，发现自己为了赶来辩论，买的恰好
      是最不喜欢的馅。她把便签翻过去，问玩家有没有值得推荐的早饭。
    tags: [文萃楼走廊, 网协群聊, 课间早饭, 饮食分歧]

  - id: lunch-plans-with-too-many-vetoes
    title: 聚餐地点投了三轮，还是随便
    seed: |
      中午，几个网协成员在校园林荫道岔口等人，一边商量周末聚餐去哪。
      同学甲把群投票亮给大家看：“都行”票数最高，剩下三家各得一票。
      树莓娘提议投“都行”的人先说，结果同学丙表示自己都行，但不吃辣，
      同学乙说都行，但不想排队。树莓娘正要吐槽，玩家看见她投的也是
      “都行”。她承认自己只是怕选到大家不喜欢的，现在倒有个很想吃的。
      同学甲把手机收起来，说先听听那个到底是什么。
    tags: [校园林荫道, 网协聚餐, 选择困难, 各有所好]

  - id: delivery-for-your-majesty
    title: 拼单昵称，一个比一个不敢认
    seed: |
      下午的社团广场，网协成员拼的饮料到了，同学丙正在逐个念备注。
      “全校第一可爱殿下，少冰”念出来时，树莓娘突然转身研究旁边的墙。
      玩家手里的订单还有“绝不拖稿的宣传”“明天一定早起”，都是协会群
      上次互改昵称留下的。同学乙催树莓娘赶紧领，轮到自己的“从不鸽人”
      又没了声音——她刚把晚上的约局推到明天。同学丙说今天只认杯子
      不认人，但他自己那杯的昵称已经被手指遮住了。
    tags: [社团广场, 网协拼单, 群昵称, 集体出糗]

  - id: five-more-minutes-before-studying
    title: 自习小组的休息时间超标了
    seed: |
      午后的阶梯教室，网协几个人约了期末自习。树莓娘负责计时，约好
      每学半小时休息五分钟。玩家回来时，她和同学丁正在讨论哪种午睡
      姿势最不容易压麻胳膊，桌上的计时器已经停了十二分钟。
      同学乙问下一段是不是该开始了，树莓娘说自己一直在等大家回来，
      同学丁却记得人早就齐了。她翻开书，里面夹着上午写的复习计划，
      第一项还没勾。同学乙也没好到哪去，练习纸上全是挑午饭的草稿。
    tags: [阶梯教室, 网协自习小组, 午后犯困, 集体摸鱼]

  - id: notes-with-too-many-rabbits
    title: 例会记录怎么全是兔子
    seed: |
      网协例会刚在阶梯教室结束，同学甲想借树莓娘的记录确认几个活动
      点子。树莓娘递出本子才想起，自己把大家的发言都画成了兔子：
      抱着桌游盒的、举相机的，还有一只趴在零食堆上。同学甲觉得比
      文字好认，指着一只抱着空纸箱的问这是谁。同学丙说像自己提的
      闲置交换，树莓娘却记得那是有人建议搬东西。玩家也在会上，
      几个人把本子摊平，各自认领起来，偏偏谁都不认那只睡着的。
    tags: [阶梯教室, 网协例会, 涂鸦记录, 各说各话]

  - id: three-laps-count-as-exercise
    title: 网协散步群，今天终于有人动了
    seed: |
      晚上的校园林荫道上，玩家、树莓娘和同学乙实践协会群里的饭后
      散步约定。群建了三天，消息全是表情包，今天总算凑齐三个人。
      树莓娘摆着手臂说这必须算正式运动，同学乙看了一眼她手里的饮料，
      问是不是买喝的才顺便出门。树莓娘让她先报步数，结果两人的数字
      差了近一倍。她怀疑同学乙白天绕教学楼也算进去了，同学乙说约定
      本来就没写只算晚上。群里同学丙发来一句“精神上陪跑”，还附了零食照。
    tags: [校园林荫道, 网协散步群, 运动约定, 嘴上积极]

  - id: an-afternoon-suddenly-free
    title: 例会是明天，零食已经拆了
    seed: |
      下午的文萃楼走廊，玩家和树莓娘遇见同样来开网协例会的同学丙。
      三人对着空教室核对通知，才发现转发截图把日期截掉了，例会在明天。
      树莓娘刚拆开的饼干还拿在手里，同学丙已经在群里发了“我到了”。
      同学甲回复自己也正上楼，顺手问既然来了要不要借她新买的桌游看看。
      树莓娘说来都来了，但自己昨天才宣称这种游戏一眼就能看懂规则。
      同学甲发来的规则书照片看起来很厚，走廊里暂时没人接话。
    tags: [文萃楼走廊, 网协例会, 看错日期, 临时凑局]

  # 协会活动：技术兴趣之外，也有宣传、游戏和不太熟练的分享。
  - id: wrong-room-right-line
    title: 宣传短片还没开拍，台词先吵起来了
    seed: |
      白天的阶梯教室里，几位网协成员试读招新短片台词。同学甲写了
      “加入我们，开启无限可能”，树莓娘刚念完，同学丙就问能不能具体点，
      比如教他少熬几次夜。另一版写着“这里有人陪你研究奇怪的小东西”，
      大家倒都点头，却各自举出了键盘、纸飞机和零食包装上的抽奖规则。
      玩家手里还拿着空白的结尾页。树莓娘想把这些全塞进去，同学甲提醒
      整条短片只有三十秒，树莓娘说那自己可以念快一点。
    tags: [阶梯教室, 网协招新, 宣传短片, 各有理解]

  - id: loudest-snack-in-the-room
    title: 自习群里开始传递薯片情报
    seed: |
      晚上的阶梯教室里，几个网协成员和其他同学各自自习。树莓娘试着
      极慢地拆开薯片，包装袋却响得前排同学丁回了头。她立刻停手，
      手机紧接着收到协会自习小群的消息：同学乙也有一袋，一直没敢开。
      同学丁发了个门的表情，树莓娘问这是建议出去还是让她们离开。
      玩家还没接话，同学丁又补了一句“我带了饼干”。树莓娘看看大家
      摊开的书，在群里打下“休息五分钟？”又想起刚才才休息过。
    tags: [阶梯教室, 网协自习小组, 零食, 无声商量]

  - id: confident-until-the-first-question
    title: 讲五分钟爱好，标题占了两分钟
    seed: |
      网协在阶梯教室办随意分享，每人讲五分钟最近迷上的东西。
      同学丁准备讲机械键盘，光解释标题里的几个词就用掉两分钟。
      树莓娘举手说想先知道为什么他的键盘比自己的书包还贵，他一下
      来了精神，翻出更多照片。同学乙抱着准备讲的推理小说，看着时间
      欲言又止。玩家手里拿着计时手机，树莓娘悄悄指了指它，却又忍不住
      问照片里那个像糖豆的键帽能不能单买。同学丁说这就涉及另一个故事了。
    tags: [阶梯教室, 网协兴趣分享, 冷门爱好, 讲着讲着超时]

