  # 研究启发：精彩授课、体力限制和时间冲突并不互相否定。
  - id: long-class-after-the-fourth-hour
    title: 课很精彩，第四节先走神
    seed: |
      傍晚的阶梯教室，你和树莓娘陪韩澈整理一门专题课的笔记。
      你看到前半段的推导抄得很完整，听他讲起老师怎样把两个概念连起来，
      可翻到后半段时，字迹越来越大，最后一页只剩几个箭头。树莓娘说
      自己不是没听懂，是脑子先下课了；韩澈指着课后要交的另一门课程论文，
      说真正让人发困的可能是时间表。你手里的笔记也在后半段空了几页。
      树莓娘说还想听后面那段，又凑过来问你，刚才是从哪儿开始没记上的。
    tags: [阶梯教室, 网协课后整理, 长课疲劳, 时间安排]
    context: 公开课程评价中既有对讲解和推导的肯定，也有长时间授课后的疲劳与论文撞期。
    concerns: [不把疲劳归咎于授课者, 不把研究生课程体验冒充本科普遍事实]
    boundaries: [不写真实课程名称或学期安排, 不强行安排人物完成某种补救路线]
    angles: [喜欢一门课和撑不住时长可以同时成立, 课程之间的时间冲突]
    keywords: [专题课, 课堂疲劳, 课程论文, 互补笔记]

  - id: study-pair-switches-methods
    title: 一个人会讲，另一个会计时
    seed: |
      晚上的校园林荫道边，你和树莓娘遇到刚结束练习的林小满。
      你听她把一道题的概念讲得很顺，她却指着计时记录，说限时练习的时间
      全花在了第一问。树莓娘说自己也常在最后一分钟改答案，越改越拿不准。
      林小满从草稿本里翻出另一种做法，问你愿不愿意听她讲讲，再帮忙计时。
      她把两种标记不同的草稿递到你们面前，一页边角被风掀起来，你看到
      最上面写着的不是分数，而是“先跳过，等会儿回来”。
    tags: [校园林荫道, 网协复习搭子, 限时练习, 互相补足]
    context: 公开课程评价中出现过概念理解、独立练习、答疑与遇到难题先跳过再返回等学习经验。
    concerns: [不制造“学霸和差生”的固定标签, 把互助写成方法交换而非单向拯救]
    boundaries: [不复述公开评论原话, 不给出考试保证或成绩承诺]
    angles: [表达理解和限时作答是不同能力, 练习时保留修改空间]
    keywords: [限时练习, 概念解释, 解题策略, 复习搭子]

  - id: materials-in-the-wrong-place
    title: 资料到底放在哪个入口
    seed: |
      下午的文萃楼走廊，许晚晴递给你一张写着几个课程资料入口的便签。
      你逐一打开，课件在一个页面，作业说明在另一处，旧通知还被转发到了
      网协群里。她说想整理一份清楚的指引，树莓娘却先问你：如果只看见
      最后一条消息，会不会漏掉前面的要求。许晚晴在手机里按时间翻找文件，
      指着两个差不多的文件名停下来，说自己也分不清哪个才是新的。
      走廊里有人经过，她没有急着发新的链接，只把便签递近些，问你
      哪一处最容易看糊涂。
    tags: [文萃楼走廊, 网协资料整理, 课程入口, 通知筛选]
    context: BIT101 公开资料涉及资料共享与消息系统；公开课程评价也反复提到课件、作业和提问入口。
    concerns: [把入口混乱写成可沟通的信息整理问题, 不凭空指控平台或教师]
    boundaries: [不使用真实账号、链接或内部资料, 不写成软件故障排查剧情]
    angles: [资料存在不等于容易找到, 转发消息如何失去上下文]
    keywords: [课件, 作业说明, 资料共享, 通知筛选]

  - id: course-review-written-for-next-student
    title: 评价写到“适合谁”就卡住
    seed: |
      晚上的阶梯教室里，你和树莓娘、许晚晴准备给一门上过的课写几句
      评价。许晚晴已经写好“讲得清楚”，树莓娘提议加上“作业不算多”。
      你听许晚晴说起课堂上喜欢的一段推导，树莓娘却又提起几门课同时交
      作业的那一周，问这到底算不算轻松。许晚晴把光标停在“推荐”后面，
      问你要不要写得具体些。树莓娘删删改改，把屏幕转向你：“这句话，
      没上过课的人能看懂吗？”你面前还有一行空白。
