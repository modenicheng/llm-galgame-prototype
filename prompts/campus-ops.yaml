# 校园技术社团值班 —— 叙事种子目录（scenario seed catalog）
#
# 每局只选择一个种子作为本局起点。种子是描述性素材：起始情境、可见异常、
# 少量线索与风险。它不是剧本、任务清单或状态机——不规定事件顺序、互动
# 轮数、正确路线或结局。运行时由 src/campus/scenario-seeds.ts 加载。
#
# 允许字段：id / title / seed / tags / context / concerns / boundaries /
# angles / keywords。严格校验：任何流程化字段（如 required_rounds、
# success_path、failure_path、ending_count）都会导致启动失败。

version: 1

guidance: |
  种子只提供开场起点。同一种子允许发展出完全不同的故事：快速解决、
  深入排查、权限或隐私讨论、交接与协作误会，或留下待查的问题。

seeds:
  - id: old-device-before-opening
    title: 开场前仍在运行的旧设备
    seed: |
      技术分享会开始前，教室里一台没人记得启动过的旧设备仍在运行。
      树莓娘只确认了它没有明显报错，但不知道它是否应该现在关机，
      也一时找不到登记信息里对应的负责人。
    tags:
      - 技术分享会
      - 旧设备
      - 交接不明

  - id: projector-on-but-blank
    title: 投影亮了，但没有画面
    seed: |
      分享会即将开始，投影仪通电、幕布落下，但幕布上没有画面。
      备用设备就放在旁边。观众陆续入场，留给尝试的时间不多。
    tags:
      - 技术分享会
      - 现场设备

  - id: slow-computer-no-backup
    title: 电脑很慢，但不能直接重装
    seed: |
      一位同学带来一台越来越慢的笔记本电脑求助。
      机器里存着尚未备份的重要课程资料，任何"直接重装"式的建议
      都必须先解决资料安全的问题。
    tags:
      - 电脑诊所
      - 数据安全

  - id: link-works-but-should-not-be-public
    title: 链接能打开，但文件不该公开
    seed: |
      有成员发现上周活动资料的分享链接被转发到了社团之外，
      仍然可以打开。文件的敏感程度和原始的共享范围都不明确，
      资料所有者暂时联系不上。
    tags:
      - 校内云盘
      - 隐私

  - id: mirror-sync-looks-done-but-is-not
    title: 镜像源看起来同步了，其实还没有
    seed: |
      值班巡检时发现镜像源页面显示"同步成功"，但不同地点查到的
      软件版本不一致。同步日志和实际状态对不上，影响范围还不清楚。
    tags:
      - 镜像源维护
      - 排查

  - id: printer-online-but-job-stuck
    title: 打印机在线，但任务没有出来
    seed: |
      值班台收到反馈：诊所的公用打印机显示在线，但一位同学的
      打印任务停在队列里没有输出。暂时不知道问题出在设备、
      账号还是队列本身，旁边还有人在等。
    tags:
      - 电脑诊所
      - 现场压力

  - id: extra-booking-in-the-sheet
    title: 预约表里多出一个人
    seed: |
      诊所预约后台在同一时间段出现两条预约记录，备注栏一条写着
      "帮忙代约"，另一条没有说明。后台没有重复提交的提示，
      当天的志愿者排班也只有一人。
    tags:
      - 预约后台
      - 规则与公平

  - id: attachment-uploaded-or-not
    title: 附件上传成功了吗
    seed: |
      面试开始前，一位候选人说材料已经上传成功，
      但面试官的界面里看不到附件。候选人在等待，
      重传可能来不及，附件里还有个人信息。
    tags:
      - 面试系统
      - 隐私

  - id: every-ticket-is-top-priority
    title: 所有工单都是最高优先级
    seed: |
      任务列表里堆满了标着"紧急""救命"的工单，大多缺少影响范围
      和负责人信息，其中几张描述几乎相同。值班交接前需要有人
      把这些事实补齐。
    tags:
      - 任务管理
      - 协作

  - id: still-syncing-after-the-event
    title: 活动结束后仍在同步
    seed: |
      活动已经结束，后台却有一个不明同步任务持续运行，
      占着不小的带宽。任务的所有者没有署名，
      今晚还有另一场活动要用同一条线路。
    tags:
      - 校内云盘
      - 资源占用

  - id: handover-note-says-business-as-usual
    title: 交接文档写着"照旧处理"
    seed: |
      新值班的成员接手时只拿到一句模糊备注："这里照旧处理就行"。
      旧负责人暂时联系不上，而"照旧"的做法按现在的规则
      似乎已经不太合适。
    tags:
      - 值班交接
      - 责任

  - id: raspberry-girl-unsure-about-shutdown
    title: 树莓娘也不确定该不该关机
    seed: |
      一台无人认领的设备正在运行，屏幕上没有明显错误，
      但没人说得出它的用途。保留现场证据和降低风险之间
      需要有人做判断，树莓娘把这个问题交给了玩家。
    tags:
      - 旧设备
      - 最小风险
