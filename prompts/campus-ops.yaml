    context: 百团大战是校级社团和学生组织的联合招新摆摊活动，明早9点正式开始。摊位核心体验玩法之一就是这个 GalGame 本作——由大模型当场逐句生成的互动故事，你和树莓娘是它的制作者；ddl 是让它在开摊前体面运行。
    concerns: ["本局的核心张力是时间极紧，还敢不敢对能用的东西动大手术：调音量式的小修剧情里已经走过一遍、被证明治标不治本，不要再绕回音频参数", "破坏性重构是摆着的风险选项：可以权衡、可以蠢蠢欲动、可以被劝住，但不替玩家选它，也不写成必然正确"]
    boundaries: ["凌晨 5:25:39 只是一个被看到的时间，任何角色都不解释它为什么这么精确", "不写真实存在的学校、社团或平台的规章与内幕"]
    angles: ["一个晚上对一场豪赌：改砸了开天窗，不改心痒到开摊", "自指涉：他们通宵打磨的，正是玩家此刻正在玩的东西"]
    keywords: [ddl, 百团大战, 破坏性重构, 摊位演示]

