    title: 距离 DDL 还有…… 3h？！
    seed: |
      你正在为网协第二天的“百团大战”做准备。它在早上9点正式开始。
      晚上。你和树莓娘找到了文萃楼的 24h 自习室，准备晚上赶一下ddl。当前，你负责的是基于 LLM 大模型的
      实时 GalGame。这是第二天网协摊位的核心体验玩法之一。即使现在它已经可以正确运行，
      但树莓娘说背景音乐太大了，总会盖住台词……小修小补不是没人试过，治标不治本。
      真正像样的改法只剩一个：把接音乐的整套调度推倒重来——而它现在每一处都在被使用。
      解决办法？当然是在距离ddl还有 12h 的时候进行破坏性重构啦！
      ……但你真的会这样做出选择么？还是说，你有其他方法呢？
      至少，请不要一把梭干到了第二天凌晨 5:25:39。不要问剧本作者为什么有这么精确的时间。
