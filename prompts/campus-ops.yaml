      什么，却总在需要一个定义时翻错页。树莓娘画了几只兔子当索引，指着
      旁边的缩写问你能不能认出来，说自己已经忘了。桌上还有一张关于课堂
      互动加分的说明，你听她们争论“参与过”到底怎样计算。许晚晴没有急着
      重写，只是把说明放到最上面，问你先整理检索方式，还是先把不确定的
