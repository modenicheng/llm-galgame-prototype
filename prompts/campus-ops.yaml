# 网协成员的校园日常 —— 叙事种子目录（scenario seed catalog）
#
# 每局只选择一个种子作为本局起点。种子是描述性素材：起始情境、人物的
# 小心思、少量线索与悬念。它不是剧本、任务清单或状态机——不规定
# 事件顺序、互动轮数、正确路线或结局。运行时由 src/campus/scenario-seeds.ts 加载。
#
# 允许字段：id / title / seed / tags / context / concerns / boundaries /
# angles / keywords。严格校验：任何流程化字段（如 required_rounds、
# success_path、failure_path、ending_count）都会导致启动失败。

version: 1

guidance: |
  种子正文统一以第二人称“你”指代玩家，从你在场所见、所闻展开；角色
  台词可以使用第一人称“我／我们”。不以“玩家／主角／他／她”第三人称
  代称你，不切换为旁观或全知视角，不替你决定想法、台词和后续行动。
  其他角色可正常使用姓名和代词，其心思通过你能观察到的言行表现。

  以网络开拓者协会成员之间的日常为主：筹备活动、兴趣交流、值班间隙、
  散场闲聊，也有一起自习、拼单和散步。协会是大家相识、共事和积累
  糗事的地方，技术兴趣可以出现，不必每局都出故障或有人来修电脑。
  趣味来自具体的兴趣、尝试、分歧和意外发现，不要每局都靠夸口后被拆台。
  人物按普通同学、朋友和协会伙伴相处，不写暧昧、恋爱暗示或配对起哄。

  每局主要围绕玩家、树莓娘和一位配角展开，同场参与互动的非玩家角色
  至多两位。其他成员留在背景或通过简短消息、转述提及，不为接梗轮流
  拉人登场，也不把群聊写成另一场多人对话；给玩家留出插话和行动的空间。
  配角使用已注册的许晚晴、林小满、夏一鸣、韩澈，性格与人设固定，
  每局的临时处境不沿用到其他种子；下列趣事均属本项目虚构。

  场景以当前注册的文萃楼走廊、校园林荫道、社团广场、阶梯教室为限，
  可按已有昼夜版本自然转换；其他地点可以提及，不必前往。
  纸条、书本、零食、手机照片等小道具由文字呈现，不依赖专用 CG、
  道具贴图、换装或新音效。种子只给开场，不规定谁对谁错或结局。

seeds:
  # 兴趣活动：熟悉的协会伙伴也有不同的参与习惯。
  - id: board-game-teacher-wants-to-play
    title: 规则我都懂，就是没赢过
    seed: |
      下午的阶梯教室里，许晚晴请你和树莓娘帮她试一款准备带去网协
      活动的三人桌游。她讲规则很清楚，摆起牌却格外谨慎，说以前每次
      都在教别人，自己还没完整玩过一局。树莓娘刚摸到牌就问她这手
      应该怎么出，许晚晴习惯性伸手，碰到自己的牌才停住——今天她
      也在比赛。说明书摊在你们中间，树莓娘提议第一局边教边玩，
      许晚晴却说想试试谁都不看别人手牌的感觉。你的起手牌还扣着。
    tags: [阶梯教室, 网协桌游试玩, 教人和参赛, 初次上手]

  # 熟人日常：每场只留一位配角，让反应和行动能来回接上。
  - id: delivery-for-your-majesty
    title: 拼单昵称，一个比一个不敢认
    seed: |
      下午的社团广场，你和树莓娘、夏一鸣核对网协拼单的饮料，替
      还没来的成员分好。夏一鸣念到“全校第一可爱殿下，少冰”，树莓娘
      就开始研究旁边的墙，说应该按口味认，不该按昵称认。
      你手里的订单上，还有几条协会群互改昵称留下的古怪备注。
      夏一鸣把自己的杯子转了半圈，偏偏让树莓娘看清“奶茶鉴定大师”。
      她指着两杯外观相近、杯签却被袋里水汽泡花的饮料，问大师能不能
      不拆封就分出来。手机订单还在，夏一鸣刚才说自己光看颜色就够。
    tags: [社团广场, 网协拼单, 群昵称, 熟人玩笑]

  - id: notes-with-too-many-rabbits
    title: 例会记录怎么全是兔子
    seed: |
      网协例会散场后的阶梯教室里，只剩你和树莓娘、许晚晴整理桌面。
      许晚晴问起会上提过的活动点子，你看到树莓娘把发言画成了兔子：
      抱着桌游盒的、举相机的，还有一只钻在纸箱里。
      许晚晴认出前两个，第三个却可能是闲置交换，也可能是纸箱改造。
      树莓娘说自己也记不清，但坚称兔子脚边那条波浪线肯定有用。
      你当时也在场，本子旁边还夹着会议议题。许晚晴没有急着让她
      重写，反而拿起笔问你，能不能给这几张小画补上说得通的注释。
    tags: [阶梯教室, 网协例会, 涂鸦记录, 共同回忆]

  - id: an-afternoon-suddenly-free
    title: 例会是明天，零食已经拆了
    seed: |
      下午的文萃楼走廊，你和树莓娘遇见同样来开网协例会的夏一鸣。
      你们对着空教室核对通知，才发现转发截图把日期截掉了，例会在明天。
      树莓娘拆开的饼干还拿在手里，夏一鸣已经在群里发了“我到了”。
      他问你要不要撤回，消息下面却刚好出现一个点赞。
      你看到他包里还放着本漫画，他说特意带来借给大家。树莓娘也
      翻出拖了一周的作业。走廊很安静，下午忽然没了安排，
      夏一鸣说既然都带了东西，是不是可以先别急着白跑一趟。
    tags: [文萃楼走廊, 网协例会, 看错日期, 意外空闲]

  - id: loudest-snack-in-the-room
    title: 自习时最响的东西是薯片袋
    seed: |
      晚上的阶梯教室里，你和树莓娘、韩澈坐在同一排自习，远处还有
      其他安静看书的人。树莓娘试着极慢地拆开薯片，包装袋却响得她
      自己都停了手。韩澈把手机推过来，屏幕上只有一个门的表情。
      你看到她打下“出去吃？还是我太吵了？”，还没发出，他又加上
      “我带了饼干”。树莓娘在草稿纸角落写了“休息？”推到你面前，
      旁边还留着你们刚约好的复习结束时间。韩澈把书签夹好，书却没合上。
    tags: [阶梯教室, 网协自习搭子, 零食, 无声商量]

  # 协会筹备：以试读、试讲和收尾承载活动，现场无需凑齐全体成员。
  - id: wrong-room-right-line
    title: 三十秒的招新短片，哪句都舍不得删
    seed: |
      白天的阶梯教室，许晚晴请你和树莓娘试读网协招新短片的文案。
      第一版写着“开启无限可能”，树莓娘念完问这具体是干什么。
      许晚晴换出另一版，里面有一起研究键盘、办分享和边收摊边聊晚饭，
      树莓娘说这一版像自己认识的协会，读完却用了快一分钟。
      片子只留三十秒，许晚晴先划掉一句，停了停，又在旁边画了
      个保留记号。你拿着计时手机，纸上还有一处空白。她问你们，
      会怎么向一个完全没听过网协的同学介绍这里。
    tags: [阶梯教室, 网协招新, 宣传试读, 取舍]

  - id: confident-until-the-first-question
    title: 讲五分钟爱好，标题占了两分钟
    seed: |
      网协兴趣分享前一晚，韩澈在阶梯教室请你计时、树莓娘试听。
      他准备讲机械键盘，光解释标题里的几个词就用了两分钟。
      树莓娘问为什么他的键盘比自己的书包还贵，他一下来了精神，
      翻出更多照片，没再提刚才那堆术语。你手机上的时间还在走。
      韩澈停下来问，是不是该从这个问题讲起。树莓娘点头，却紧接着
      问那个像糖豆的键帽能不能单买。他看了一眼自己精心列的提纲，
      那个问题恰好不在里面。
    tags: [阶梯教室, 网协兴趣分享, 冷门爱好, 听众想听什么]

