# 网协成员的校园日常 —— 叙事种子目录（scenario seed catalog）
#
# 每局只选择一个种子作为本局起点。种子是描述性素材：起始情境、人物的
# 小心思、少量线索与悬念。它不是剧本、任务清单或状态机——不规定
# 事件顺序、互动轮数、正确路线或结局。运行时由 src/campus/scenario-seeds.ts 加载。
#
# 允许字段：id / title / seed / tags / context / concerns / boundaries /
# angles / keywords。严格校验：任何流程化字段（如 required_rounds、
# success_path、failure_path、ending_count）都会导致启动失败。
#
# 字段去向：title/seed 上序章卡（玩家可见）；tags 进 canon 的
# scenario_tags；context/concerns/boundaries/angles 进 canon 的
# scenario_context / scenario_concerns / scenario_boundaries /
# scenario_angles——canon 只进提示词，是"模型可见、玩家不可见"的
# 通道，适合给模型补设定（世界事实、写作禁区、切入角度）。keywords
# 仅作目录检索，不进提示词。

version: 1

guidance: |
  种子正文统一以第二人称“你”指代玩家，从你在场所见、所闻展开；角色
  台词可以使用第一人称“我／我们”。不以“玩家／主角／他／她”第三人称
  代称你，不切换为旁观或全知视角，不替你决定想法、台词和后续行动。
  其他角色可正常使用姓名和代词，其心思通过你能观察到的言行表现。

  以网络开拓者协会成员之间的日常为主：筹备活动、兴趣交流、值班间隙、
  散场闲聊，也有一起自习、拼单和散步。协会是大家相识、共事和积累
  糗事的地方，技术兴趣可以出现，不必每局都出故障或有人来修电脑。
  趣味来自具体的兴趣、尝试、分歧和意外发现，不要每局都靠夸口后被拆台。
  人物按普通同学、朋友和协会伙伴相处，不写暧昧、恋爱暗示或配对起哄。

  每局主要围绕玩家、树莓娘和一位配角展开，同场参与互动的非玩家角色
  至多两位。其他成员留在背景或通过简短消息、转述提及，不为接梗轮流
  拉人登场，也不把群聊写成另一场多人对话；给玩家留出插话和行动的空间。
  配角使用已注册的许晚晴、林小满、夏一鸣、韩澈，性格与人设固定，
  每局的临时处境不沿用到其他种子；下列趣事均属本项目虚构。

  场景以当前注册的文萃楼走廊、校园林荫道、社团广场、阶梯教室为限，
  可按已有昼夜版本自然转换；其他地点可以提及，不必前往。
  纸条、书本、零食、手机照片等小道具由文字呈现，不依赖专用 CG、
  道具贴图、换装或新音效。种子只给开场，不规定谁对谁错或结局。

seeds:
