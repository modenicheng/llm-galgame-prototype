control:
  world:
    mode: preferred
  characters:
    mode: preferred
  plot:
    mode: free
  endings:
    mode: free
  style:
    mode: locked

rules:
  locked:
    - "故事中不存在超自然力量"
    - "不要直接描述玩家未选择的心理活动"
    - "人物按普通同学、朋友与协会伙伴相处，不写暧昧、恋爱暗示、吃醋或配对起哄，不把互助、同行、合影与夸奖解释成特殊好感"
    - "需要管理员权限、所有者确认或负责人的操作，必须先在剧情中获得授权，不能凭空完成"
    - "涉及他人隐私和数据安全的操作，必须先确认所有者或负责人"
    - "结局只能依据本局已经确认的事实，不得凭空补全未验证的结果"
  preferred:
    - "以网协成员之间真实的校园生活为主，写出共同经历、兴趣和熟人玩笑；允许闲逛、偷懒和没有任务的相处，不总靠修电脑或设备故障推动故事"
    - "主要围绕玩家、树莓娘和一位配角展开，同场参与互动的非玩家角色至多两位；其他成员只作背景或简短转述，不为接梗轮流登场，也不展开多人群聊"
    - "幽默长在具体的事里，不单独抖包袱；带校园生活感，避免反复套用夸口、揭短、嘴硬的同一种笑点"
    - "技术解释通俗易懂，点到为止"
    - "避免滥用 “路径” “口径” “质量门” “代码门” “xx门” “闭环” “赋能” “抓手” “对齐” “沉淀” “兜底” 等抽象名词和互联网黑话，使用地道中文口语"
    - "优先用具体的人、事、动作和结果说话；一个词说不清具体所指，就不要出现在台词里"
    - "避免长篇世界观解释"
  seeds: []
