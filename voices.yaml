# 角色音色配置 V3（严格）
#
# 每个角色通过 config.yaml characters.<key>.voice_profile 引用一个逻辑音色。
# dashscope 绑定核心字段：
#   - model:         合成模型名。两个模型族协议不同（provider 按前缀自动分支）：
#                      · cosyvoice*（cosyvoice-v3-flash / v3.5-flash …）
#                        走 SpeechSynthesizer 端点，支持 rate/pitch/volume/seed/instruction。
#                      · qwen3-tts*（qwen3-tts-flash / -instruct-flash / -vc- / -vd- 快照名）
#                        走 multimodal-generation 端点，固定 24000 Hz PCM 输出；
#                        不支持 rate/pitch/volume/seed（发送前自动丢弃）；
#                        仅 -instruct- 模型支持逐请求指令（instruction → instructions）。
#   - voice_id_env:  存放 voice-id 的环境变量名（voice-id 放 .env，像 API key 一样，
#                     各协作者可各自复刻/设计自己的音色，互不串扰）
#
# voice-id 三种来源，全部只需复制 id 填入 .env，无需本地调用：
#   1. 系统音色：音色列表中的字面量
#        · cosyvoice-v3-flash：longxiaochun_v3、longanyang 等 long 前缀
#        · qwen3-tts-flash：Cherry、Serena、Ethan、Chelsie 等英文人名（48 个，含方言）
#   2. 声音复刻：百炼控制台 → 选择目标模型 → 复刻音色 → 上传 10~20 秒音频 → 得到 voice-id
#   3. 声音设计：百炼控制台 → 选择目标模型 → 设计音色 → 填写声音描述 → 得到 voice-id
#
# ⚠ 模型族之间音色不互用（官方 FAQ）：复刻/设计音色创建时绑定目标模型。
#   cosyvoice 复刻的音色 id（cosyvoice-…-前缀）不能用于 qwen3-tts-vc，反之亦然；
#   换模型族必须在该模型下重新复刻/设计。启动校验会按 id 前缀拦截串用。
#
# ⚠ 使用 qwen3-tts 族时，config.yaml 的 media.audio.synthesis.sample_rate
#   必须为 24000（cosyvoice 同样支持 24 kHz，可混布）。
#
# 旁白（narration）不配音：只有角色行会合成语音。

version: 3

profiles:
  # ---- 本地 qwen3-tts 服务（tts-server/，RTX 5060 本机推理）----
  # providers.local.voice = tts-server/voices/registry.json 的音色键。
  # 树莓娘 = paimeng.wav 参考音克隆；四配角 = 真人参考音（2026-09-19/20
  # 更换；原 CustomVoice 内置音色合成路线仅作备用）转 Base 克隆 prompt——
  # 运行时只加载一个 1.7B-Base，五音色单模型、可批处理并行。
  # 音色重建后 bump voice_revision 使缓存失效。
  raspberry_main:
    semantic:
      base_description: 树莓娘，活泼的协会看板娘，语速偏快，情绪起伏明显。
      allowed_delivery:
        - cheerful
        - excited
        - gentle
        - firm
      forbidden_delivery:
        - announcer
        - exaggerated
    providers:
      local:
        model: local-qwen3-tts
        voice: paimeng
        voice_revision: 1

  xuwanqing_main:
    semantic:
      base_description: 许晚晴，温和稳重的学姐，轻声，句子完整，语气词少。
      allowed_delivery:
        - gentle
        - restrained
        - firm
      forbidden_delivery:
        - exaggerated
        - childish
        - announcer
    providers:
      local:
        model: local-qwen3-tts
        voice: xuwanqing
        # 2026-09-19 参考音更换（内置音色→真人音源），bump 失效旧缓存
        voice_revision: 2

  linxiaoman_main:
    semantic:
      base_description: 林小满，直率嘴快的后辈，短句，语速快，反问开路。
      allowed_delivery:
        - cheerful
        - firm
        - hesitant
      forbidden_delivery:
        - announcer
        - exaggerated
    providers:
      local:
        model: local-qwen3-tts
        voice: linxiaoman
        # 2026-09-19 参考音更换（内置音色→真人音源），bump 失效旧缓存
        voice_revision: 2

  xiayiming_main:
    semantic:
      base_description: 夏一鸣，自来熟的气氛担当，嗓门大，比喻夸张，爱接梗。
      allowed_delivery:
        - cheerful
        - excited
        - firm
      forbidden_delivery:
        - announcer
        - gentle
    providers:
      local:
        model: local-qwen3-tts
        voice: xiayiming
        # 2026-09-19 参考音更换（内置音色→真人音源），bump 失效旧缓存
        voice_revision: 2

  hanche_main:
    semantic:
      base_description: 韩澈，话少的学长，短句，平静，冷幽默。
      allowed_delivery:
        - restrained
        - firm
        - gentle
      forbidden_delivery:
        - exaggerated
        - excited
        - announcer
    providers:
      local:
        model: local-qwen3-tts
        voice: hanche
        # 2026-09-19 参考音更换（内置音色→真人音源），bump 失效旧缓存
        voice_revision: 2

  # qwen3-tts 复刻音色（voice-id 在 .env 的 QWEN3_VOICE_SUYAO）
  # 注意：需在百炼控制台对 qwen3-tts-vc 模型复刻苏遥音色（10~20s 干净人声，
  # 采样率 ≥24kHz 单声道）；旧的 cosyvoice 复刻 id 不能直接沿用。
  # 想切回 CosyVoice：model 改回 cosyvoice-v3.5-flash，
  # voice_id_env 改回 COSYVOICE_VOICE_SUYAO（旧 id 仍在 .env 中）。
  suyao_main:
    semantic:
      base_description: 年轻女性，音色清亮偏冷，表达克制，句子较短。
      allowed_delivery:
        - restrained
        - hesitant
        - firm
        - gentle
      forbidden_delivery:
        - exaggerated
        - childish
        - announcer

    providers:
      dashscope:
        model: qwen3-tts-vc-2026-01-22
        # model: cosyvoice-v3.5-flash
        # voice_id_env: COSYVOICE_VOICE_SUYAO
        voice_id_env: QWEN3_VOICE_SUYAO
        # qwen3-tts-vc 不支持逐请求指令（provider 会丢弃）；qwen3-tts-instruct 系才可 free
        instruction_mode: none

  # 林澈（玩家角色）qwen3-tts 复刻音色（voice-id 在 .env 的 QWEN3_VOICE_LINCHE）
  linche_main:
    semantic:
      base_description: 年轻女性，声线自然偏沉，语气平淡随性，句子简短。
      allowed_delivery:
        - restrained
        - hesitant
        - firm
      forbidden_delivery:
        - exaggerated
        - childish
        - announcer

    providers:
      dashscope:
        model: qwen3-tts-vc-2026-01-22
        # model: cosyvoice-v3.5-flash
        # voice_id_env: COSYVOICE_VOICE_LINCHE
        voice_id_env: QWEN3_VOICE_LINCHE
        # qwen3-tts-vc 不支持逐请求指令（provider 会丢弃）；qwen3-tts-instruct 系才可 free
        instruction_mode: none

  # 系统音色示例：直接使用预设音色（voice-id 放 .env）
  # · cosyvoice-v3-flash 配 longanyang（支持 Instruct 固定格式 → fixed_emotion）
  # · qwen3-tts-flash 配 Cherry（无逐请求指令 → none；-instruct 模型才可 free）
  # 注意：启动时会校验本文件中所有 dashscope 绑定的音色变量（含此示例），
  # 未在 config.yaml 引用的 profile 也需在 .env 中设好对应变量。
  # example_system_voice:
