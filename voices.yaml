  #     base_description: 阳光大男孩，语速略快。
  #   providers:
  #     dashscope:
  #       model: qwen3-tts-flash
  #       voice_id_env: QWEN3_VOICE_SYSTEM_SAMPLE
  #       instruction_mode: none
