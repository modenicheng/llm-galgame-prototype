# 角色音色配置 V3（§14.1）
#
# 角色只引用逻辑音色配置（config.yaml characters.voice_profile），
# 具体供应商参数只存在于本文件，永不进入浏览器。
#
# V3 严格模式：version 必须为 3；provider binding 恰好是
# model + voice_id_env。voice_id_env 指向 .env 中的音色 ID。
# V2 的 voice_sources（零样本复刻资产注册）已移出运行时配置。

version: 3

profiles:
  suyao_main:
    semantic:
      base_description: >
        年轻女性，音色清亮偏冷，表达克制，句子较短。
      allowed_delivery:
        - restrained
        - hesitant
        - firm
        - gentle
      forbidden_delivery:
        - exaggerated
        - childish
        - announcer

    providers:
      dashscope:
        model: cosyvoice-v3-flash
        voice_id_env: COSYVOICE_VOICE_SUYAO
        voice_revision: 1
        instruction_mode: free
