# 角色音色配置 V2（§14.1）
#
# 角色只引用逻辑音色配置（config.yaml characters.voice_profile），
# 具体供应商参数只存在于本文件，永不进入浏览器。

version: 2

profiles:
  suyao_main:
    semantic:
      base_description: >
        年轻女性，音色清亮偏冷，表达克制，句子较短。
      allowed_delivery:
        - restrained
        - hesitant
        - firm
        - gentle
      forbidden_delivery:
        - exaggerated
        - childish
        - announcer

    providers:
      dashscope:
        model: cosyvoice-v3-flash
        voice_id_env: COSYVOICE_VOICE_SUYAO
        voice_revision: 1

# 零样本复刻资产（作者侧一次性注册用，不进入运行时，不发送给浏览器）
voice_sources:
  suyao_source:
    reference_audio: assets/voices/suyao/reference.wav
    reference_text: 这是一段音色注册参考文本。
    language: zh
