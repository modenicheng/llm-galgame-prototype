<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GalGame - Web UI</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e0e0e0;
    --text-dim: #8888aa;
    --accent: #e94560;
    --accent-dim: #c73e54;
    --gold: #d4a574;
    --ghost: rgba(255,255,255,0.18);
    --border: #2a2a4a;
  }

  html, body {
    height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 800px;
    margin: 0 auto;
  }

  /* ---- Story display ---- */
  #story {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #story .narration {
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.7;
    font-size: 15px;
  }

  #story .dialogue {
    padding: 12px 16px;
    background: var(--surface);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
  }

  #story .dialogue .speaker {
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 4px;
    font-size: 14px;
  }

  #story .dialogue .text {
    line-height: 1.6;
    font-size: 15px;
  }

  #story .end {
    text-align: center;
    padding: 32px;
    font-size: 18px;
    color: var(--gold);
    font-weight: 700;
  }

  /* ---- Interaction area ---- */
  #interaction {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 20px 32px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }

  #interaction.visible {
    display: flex;
  }

  #prompt-text {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  /* ---- Choice buttons ---- */
  #choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .choice-btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }

  .choice-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ---- Input area ---- */
  #input-area {
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  #input-area.visible {
    display: flex;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: stretch;
  }

  #text-input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    resize: none;
    min-height: 44px;
    line-height: 1.5;
    caret-color: var(--accent);
    position: relative;
    z-index: 1;
    background: transparent;
  }

  #text-input:focus {
    border-color: var(--accent);
  }

  /* Ghost autocomplete overlay */
  .input-suggestion-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.5;
    pointer-events: none;
    white-space: pre-wrap;
    overflow: hidden;
    color: var(--ghost);
    z-index: 0;
  }

  .input-container {
    position: relative;
  }

  #input-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-dim);
  }

  #char-count {
    font-variant-numeric: tabular-nums;
  }

  .hint-text {
    font-size: 12px;
    color: var(--text-dim);
  }

  kbd {
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    border: 1px solid var(--border);
  }

  /* ---- Preview modal ---- */
  #preview-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }

  #preview-overlay.visible {
    display: flex;
  }

  #preview-dialog {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    max-width: 520px;
    width: 90%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #preview-dialog .label {
    font-weight: 700;
    font-size: 16px;
  }

  #preview-dialog .quote {
    color: var(--gold);
    font-size: 18px;
    font-style: italic;
    padding: 8px 0;
  }

  #preview-dialog .status-line {
    color: var(--text-dim);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #preview-dialog .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  #preview-dialog button {
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 14px;
    cursor: pointer;
    background: var(--surface2);
    color: var(--text);
  }

  #preview-dialog button.primary {
    background: var(--accent);
    border-color: var(--accent);
  }

  #preview-dialog button.primary:hover {
    background: var(--accent-dim);
  }

  /* ---- Status bar ---- */
  #status-bar {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 32px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    min-height: 36px;
    align-items: center;
  }

  /* ---- Log messages ---- */
  #log-toast {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--surface2);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 200;
  }

  #log-toast.show {
    opacity: 1;
  }

  /* Spinner */
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
  }

  /* Scrollbar */
  #story::-webkit-scrollbar {
    width: 6px;
  }

  #story::-webkit-scrollbar-track {
    background: transparent;
  }

  #story::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="story"></div>
  <div id="interaction">
    <div id="prompt-text"></div>
    <div id="choices"></div>
    <div id="input-area">
      <div class="input-container">
        <div class="input-suggestion-overlay" id="ghost-text"></div>
        <textarea id="text-input" rows="2" placeholder=""></textarea>
      </div>
      <div id="input-info">
        <span id="char-count">0 / 0</span>
        <span class="hint-text"><kbd>Tab</kbd> 补全 &nbsp; <kbd>Enter</kbd> 确认 &nbsp; <kbd>Esc</kbd> 取消</span>
      </div>
    </div>
  </div>
  <div id="status-bar">
    <span id="status-phase">正在连接...</span>
    <span id="status-buffer"></span>
  </div>
</div>

<div id="preview-overlay">
  <div id="preview-dialog">
    <div class="label">你准备说：</div>
    <div class="quote" id="preview-quote"></div>
    <div class="status-line" id="preview-status">
      <span class="spinner"></span> 正在生成 NPC 回应……
    </div>
    <div class="actions">
      <button id="preview-cancel-btn">Esc 返回修改</button>
      <button id="preview-confirm-btn" class="primary">Enter 确认发送</button>
    </div>
  </div>
</div>

<div id="log-toast"></div>

<script>
// =========================================================================
// Web UI Client
// =========================================================================

let ws;
let currentInteraction = null;
let autocompleteSuffix = "";
let isComposing = false;
let compositionJustEnded = false;

// ---- WebSocket ----

function connect() {
  const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

  ws.onopen = () => {
    setStatus("已连接", "");
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      handleMessage(msg);
    } catch (e) {
      console.warn("Invalid message:", event.data);
    }
  };

  ws.onclose = () => {
    setStatus("连接断开", "正在重连...");
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    // onclose will fire after this
  };
}

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  }
}

// ---- Message handler ----

function handleMessage(msg) {
  switch (msg.type) {
    case "display":
      handleDisplay(msg.events);
      break;
    case "interaction":
      handleInteraction(msg.interaction);
      break;
    case "autocomplete":
      handleAutocomplete(msg.result);
      break;
    case "state":
      handleState(msg.state);
      break;
    case "log":
      showToast(msg.message);
      break;
  }
}

// ---- Display ----

function handleDisplay(events) {
  const story = document.getElementById("story");
  for (const evt of events) {
    const el = document.createElement("div");
    if (evt.type === "narration") {
      el.className = "narration";
      el.textContent = evt.text;
    } else if (evt.type === "dialogue") {
      el.className = "dialogue";
      const speaker = document.createElement("div");
      speaker.className = "speaker";
      speaker.textContent = evt.speaker || "???";
      const text = document.createElement("div");
      text.className = "text";
      text.textContent = evt.text;
      el.appendChild(speaker);
      el.appendChild(text);
    } else if (evt.type === "end") {
      el.className = "end";
      el.textContent = evt.text;
    }
    story.appendChild(el);
  }
  story.scrollTop = story.scrollHeight;
}

// ---- Interaction ----

function handleInteraction(interaction) {
  currentInteraction = interaction;
  const interactionEl = document.getElementById("interaction");
  const promptEl = document.getElementById("prompt-text");
  const choicesEl = document.getElementById("choices");
  const inputArea = document.getElementById("input-area");

  interactionEl.classList.add("visible");
  promptEl.textContent = interaction.prompt || "";

  // Clear previous
  choicesEl.innerHTML = "";
  choicesEl.style.display = "none";
  inputArea.classList.remove("visible");
  autocompleteSuffix = "";
  updateGhostText();

  const mode = interaction.mode;

  // Show choices if applicable
  if (mode === "choice" || mode === "hybrid") {
    if (interaction.options && interaction.options.length > 0) {
      choicesEl.style.display = "flex";
      interaction.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = `${idx + 1}. ${opt.text}`;
        btn.addEventListener("click", () => {
          if (mode === "hybrid") {
            send({
              type: "hybrid_choice",
              option_id: opt.id,
              interaction_id: interaction.interaction_id,
            });
          } else {
            send({
              type: "option_select",
              option_id: opt.id,
              interaction_id: interaction.interaction_id,
            });
          }
          resetInteraction();
        });
        choicesEl.appendChild(btn);
      });
    }
  }

  // Show input area if applicable
  if (mode === "input" || mode === "hybrid") {
    const inputSpec = interaction.input;
    const textInput = document.getElementById("text-input");
    const charCount = document.getElementById("char-count");

    inputArea.classList.add("visible");

    if (inputSpec) {
      textInput.placeholder = inputSpec.placeholder || "";
      textInput.maxLength = inputSpec.max_length || 200;
      charCount.textContent = `0 / ${inputSpec.max_length || 200}`;
    }

    // If in preview phase, show the preview overlay instead
    if (interaction.preview_phase) {
      inputArea.classList.remove("visible");
      showPreview(interaction);
    } else {
      hidePreview();
      textInput.value = interaction.draft || "";
      textInput.focus();
      updateCharCount();
    }
  } else {
    hidePreview();
  }
}

function resetInteraction() {
  currentInteraction = null;
  autocompleteSuffix = "";
  const interactionEl = document.getElementById("interaction");
  interactionEl.classList.remove("visible");
  document.getElementById("choices").innerHTML = "";
  document.getElementById("input-area").classList.remove("visible");
  document.getElementById("text-input").value = "";
  document.getElementById("prompt-text").textContent = "";
  hidePreview();
  updateGhostText();
}

// ---- Input handling ----

let inputRevision = 0;

document.getElementById("text-input").addEventListener("input", (e) => {
  updateCharCount();
  if (isComposing) return; // Don't send during IME composition
  if (compositionJustEnded) {
    compositionJustEnded = false;
    // Send immediately after composition ends
  }
  inputRevision++;
  sendInputChange(e.target.value);
});

document.getElementById("text-input").addEventListener("compositionstart", () => {
  isComposing = true;
});

document.getElementById("text-input").addEventListener("compositionend", (e) => {
  isComposing = false;
  compositionJustEnded = true;
  inputRevision++;
  sendInputChange(e.target.value);
});

document.getElementById("text-input").addEventListener("keydown", (e) => {
  if (isComposing) return; // Never intercept during IME composition

  if (e.key === "Tab" && autocompleteSuffix) {
    e.preventDefault();
    const input = e.target;
    input.value += autocompleteSuffix;
    autocompleteSuffix = "";
    updateGhostText();
    inputRevision++;
    sendInputChange(input.value);
    return;
  }

  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (currentInteraction) {
      if (currentInteraction.mode === "hybrid") {
        send({
          type: "hybrid_input",
          text: e.target.value,
          interaction_id: currentInteraction.interaction_id,
        });
        resetInteraction();
      } else {
        send({
          type: "input_confirm",
          text: e.target.value,
          interaction_id: currentInteraction.interaction_id,
        });
        // Don't reset yet — wait for preview phase
        // The server will send a new interaction with preview_phase=true
      }
    }
    return;
  }

  if (e.key === "Escape") {
    e.preventDefault();
    if (currentInteraction) {
      if (currentInteraction.mode === "hybrid") {
        send({
          type: "hybrid_cancel",
          interaction_id: currentInteraction.interaction_id,
        });
      } else {
        send({
          type: "input_cancel",
          interaction_id: currentInteraction.interaction_id,
        });
      }
      resetInteraction();
    }
    return;
  }
});

function sendInputChange(text) {
  if (!currentInteraction) return;
  send({
    type: "input_change",
    text: text,
    interaction_id: currentInteraction.interaction_id,
    revision: inputRevision,
  });
}

function updateCharCount() {
  const input = document.getElementById("text-input");
  const maxLen = input.maxLength || 200;
  document.getElementById("char-count").textContent =
    `${input.value.length} / ${maxLen}`;
}

// ---- Autocomplete ----

function handleAutocomplete(result) {
  if (!result) {
    autocompleteSuffix = "";
  } else {
    autocompleteSuffix = result.suffix;
  }
  updateGhostText();
}

function updateGhostText() {
  const input = document.getElementById("text-input");
  const ghost = document.getElementById("ghost-text");
  if (autocompleteSuffix && input.value) {
    ghost.textContent = input.value + autocompleteSuffix;
  } else {
    ghost.textContent = "";
  }
  // Sync ghost text styling
  syncGhostPosition();
}

function syncGhostPosition() {
  const input = document.getElementById("text-input");
  const ghost = document.getElementById("ghost-text");
  const inputStyles = window.getComputedStyle(input);
  ghost.style.fontFamily = inputStyles.fontFamily;
  ghost.style.fontSize = inputStyles.fontSize;
  ghost.style.lineHeight = inputStyles.lineHeight;
  ghost.style.padding = inputStyles.padding;
}

// Initial sync
window.addEventListener("load", syncGhostPosition);
window.addEventListener("resize", syncGhostPosition);

// ---- Preview modal ----

function showPreview(interaction) {
  const overlay = document.getElementById("preview-overlay");
  const quote = document.getElementById("preview-quote");
  const statusLine = document.getElementById("preview-status");

  quote.textContent = `"${interaction.preview_text || ""}"`;
  overlay.classList.add("visible");

  if (interaction.generating_response) {
    statusLine.innerHTML = '<span class="spinner"></span> 正在生成 NPC 回应……';
  } else {
    statusLine.innerHTML = '&#10003; NPC 回应已就绪';
  }
}

function hidePreview() {
  document.getElementById("preview-overlay").classList.remove("visible");
}

document.getElementById("preview-confirm-btn").addEventListener("click", () => {
  hidePreview();
  if (currentInteraction) {
    send({
      type: "preview_confirm",
      interaction_id: currentInteraction.interaction_id,
    });
    resetInteraction();
  }
});

document.getElementById("preview-cancel-btn").addEventListener("click", () => {
  hidePreview();
  if (currentInteraction) {
    send({
      type: "preview_cancel",
      interaction_id: currentInteraction.interaction_id,
    });
    // Go back to editing — re-show the input area
    const inputArea = document.getElementById("input-area");
    inputArea.classList.add("visible");
    document.getElementById("text-input").focus();
  }
});

// ---- Status bar ----

function handleState(state) {
  setStatus(state.phase, `缓冲 ${state.buffered_events} / ${state.buffered_dialogue_lines} 对白`);
}

function setStatus(phase, buffer) {
  document.getElementById("status-phase").textContent = phase;
  document.getElementById("status-buffer").textContent = buffer || "";
}

// ---- Toast ----

let toastTimer = null;

function showToast(message) {
  const toast = document.getElementById("log-toast");
  toast.textContent = message;
  toast.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

// ---- Advance ----

// Click anywhere on the story area to advance (when waiting for next line)
document.getElementById("story").addEventListener("click", () => {
  if (currentInteraction) return; // Don't advance during interaction
  send({ type: "advance" });
});

// Space/Enter on body also advances (when no interaction active)
document.addEventListener("keydown", (e) => {
  if (currentInteraction) return; // Don't intercept during interaction
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    send({ type: "advance" });
  }
});

// ---- Start ----

connect();
setTimeout(() => syncGhostPosition(), 100);
</script>
</body>
</html>
