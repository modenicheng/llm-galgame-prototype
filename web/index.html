<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="灯影夜话 —— 本地 AI 视觉小说。深夜灯下，一段由你与 AI 共同落笔的故事。" />
    <title>灯影夜话 · 本地 AI 视觉小说</title>
    <!-- Webfonts are vendored locally (web/public/fonts, regen:
         scripts/vendor-webfonts.mjs): same unicode-range subsets as Google
         Fonts but served by this host, so there is no network dependency
         (booth machines, blocked DNS) and no cross-origin font swap delay.
         The stylesheet is render-blocking on purpose: the @font-face rules
         must exist before first layout so CJK text never paints in the
         fallback stack first. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Sarasa Gothic SC (monitor DSL rendering); @font-face is lazy, so
         pages that never use the family download nothing. -->
    <link rel="stylesheet" href="/fonts/sarasa.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 32rem; margin: 4rem auto; padding: 2rem; text-align: center; color: #d8cfbc">
        此页面需要启用 JavaScript 才能运行。
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
